name: Build & Release

on:
  # Auto: pushing a version tag (e.g. v0.1.118) builds every variant
  # and drafts a GitHub Release with the installers.
  push:
    tags:
      - 'v*'
  # Manual: run from the Actions tab; version defaults to Cargo.toml.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.118); blank = use Cargo.toml version'
        required: false
        type: string
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        type: boolean
        default: false

# Cancel in-progress runs for the same ref
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===========================================================================
  # Resolve the version and whether to publish a release, once, for all jobs
  # ===========================================================================

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      do_release: ${{ steps.v.outputs.do_release }}
      shell_revision: ${{ steps.shell.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: use the tag name, always release
            VERSION="${GITHUB_REF_NAME}"
            DO_RELEASE="true"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            DO_RELEASE="${{ inputs.create_release }}"
          else
            # Manual dispatch with no version: derive from Cargo.toml
            BASE="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            VERSION="v${BASE}"
            DO_RELEASE="${{ inputs.create_release }}"
          fi
          VERSION_NUMBER="${VERSION#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          ELECTRON_VERSION="$(node -p "require('./electron/package.json').version")"
          [ "$VERSION" = "v$VERSION_NUMBER" ] || { echo "Version must start with v" >&2; exit 1; }
          [ "$VERSION_NUMBER" = "$CARGO_VERSION" ] || { echo "Tag $VERSION does not match Cargo.toml $CARGO_VERSION" >&2; exit 1; }
          [ "$VERSION_NUMBER" = "$ELECTRON_VERSION" ] || { echo "Tag $VERSION does not match Electron $ELECTRON_VERSION" >&2; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "do_release=${DO_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} do_release=${DO_RELEASE}"
      # The shell revision decides whether this release can install as a
      # core-only update. It is computed once here and asserted in every package
      # job, so the value baked into the app and the value published in the
      # manifest can never disagree.
      - id: shell
        shell: bash
        working-directory: electron
        run: |
          REVISION="$(node tools/shell-revision.js)"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "Shell revision ${REVISION}"

  # ===========================================================================
  # Build Rust binaries for all platforms
  # ===========================================================================

  test-updater:
    needs: prepare
    runs-on: ubuntu-22.04
    name: Test · updater contract and state machine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.89.0
      - name: Run updater tests
        run: "cargo test version::"
      - name: Validate Electron update bridge syntax
        run: |
          node --check electron/src/main.js
          node --check electron/src/preload.js
          node --check electron/src/core_resolver.js
          node --check electron/src/paths.js
      - name: Run desktop-shell updater tests
        run: node --test tools/tests/*.test.mjs

  build-rust:
    needs: [prepare, test-updater]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (arm64 runner builds both architectures)
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macOS
            arch: arm64
          - os: macos-14
            target: x86_64-apple-darwin
            platform: macOS
            arch: x64

          # Linux (native x64 + cross-compile arm64)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: Linux
            arch: x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: Linux
            arch: arm64
            cross: true

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows
            arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: Windows
            arch: arm64

    runs-on: ${{ matrix.os }}
    name: Rust · ${{ matrix.platform }} ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ matrix.target }}-

      # Linux arm64 cross-compilation setup
      - name: Install cross-compilation tools (Linux arm64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set cross-compilation env (Linux arm64)
        if: matrix.cross
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"

      - name: Build Rust binary
        shell: bash
        run: |
          FEATURES=""
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            FEATURES="--no-default-features"
            # Use Strawberry Perl for vendored OpenSSL build (Git Bash's perl lacks modules)
            export PATH="/c/Strawberry/perl/bin:$PATH"
          fi
          cargo build --release --target ${{ matrix.target }} --bin screenerbot $FEATURES

      - name: Determine binary name
        id: binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            echo "name=screenerbot.exe" >> "$GITHUB_OUTPUT"
            echo "path=target/${{ matrix.target }}/release/screenerbot.exe" >> "$GITHUB_OUTPUT"
          else
            echo "name=screenerbot" >> "$GITHUB_OUTPUT"
            echo "path=target/${{ matrix.target }}/release/screenerbot" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Rust binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ steps.binary.outputs.path }}
          retention-days: 7

      # ---------------------------------------------------------------------
      # Core artifact — the silent-update payload
      #
      # Most releases change only this binary (the dashboard is embedded in it),
      # so it is published on its own: a gzip stream of the executable plus the
      # digests the updater verifies before and after decompression.
      #
      # macOS is ad-hoc signed first. An unsigned Mach-O cannot be executed at
      # all on Apple Silicon, and the signature lives inside the binary, so it
      # has to be applied before the digests are taken.
      # ---------------------------------------------------------------------
      - name: Sign core binary (macOS)
        if: matrix.platform == 'macOS'
        run: codesign --force --sign - --timestamp=none "${{ steps.binary.outputs.path }}"

      - name: Package core artifact
        id: core
        shell: bash
        run: |
          set -euo pipefail
          BIN="${{ steps.binary.outputs.path }}"
          NAME="ScreenerBot-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-core.gz"
          gzip -9 -c "$BIN" > "$NAME"

          if command -v sha256sum >/dev/null 2>&1; then
            sum() { sha256sum "$1" | cut -d' ' -f1; }
          else
            sum() { shasum -a 256 "$1" | cut -d' ' -f1; }
          fi
          if stat -c%s "$NAME" >/dev/null 2>&1; then
            size() { stat -c%s "$1"; }
          else
            size() { stat -f%z "$1"; }
          fi

          # The platform key omits the packaging variant: desktop and headless
          # on the same machine run the identical core binary.
          case "${{ matrix.platform }}" in
            macOS) KEY="macos-${{ matrix.arch }}" ;;
            Linux) KEY="linux-${{ matrix.arch }}" ;;
            Windows) KEY="windows-${{ matrix.arch }}" ;;
          esac

          node -e "
            const fs = require('fs');
            fs.writeFileSync('core-meta.json', JSON.stringify({
              platform: process.argv[1],
              filename: process.argv[2],
              size: Number(process.argv[3]),
              sha256: process.argv[4],
              binarySize: Number(process.argv[5]),
              binarySha256: process.argv[6],
            }, null, 2));
          " "$KEY" "$NAME" "$(size "$NAME")" "$(sum "$NAME")" "$(size "$BIN")" "$(sum "$BIN")"
          cat core-meta.json

      - name: Upload core artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ScreenerBot-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-core.gz
            core-meta.json
          retention-days: 7

      # Also upload headless tarball for Linux
      - name: Package headless binary (Linux)
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          mkdir -p headless-pkg
          cp "${{ steps.binary.outputs.path }}" headless-pkg/screenerbot
          chmod +x headless-pkg/screenerbot
          tar -czf "ScreenerBot-${{ needs.prepare.outputs.version }}-Linux-${{ matrix.arch }}-headless.tar.gz" -C headless-pkg screenerbot

      - name: Upload headless tarball (Linux)
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: headless-Linux-${{ matrix.arch }}
          path: "ScreenerBot-${{ needs.prepare.outputs.version }}-Linux-${{ matrix.arch }}-headless.tar.gz"
          retention-days: 7

  # ===========================================================================
  # Package Electron app for macOS
  # ===========================================================================

  package-macos:
    needs: [prepare, build-rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            rust-artifact: rust-macOS-arm64
            electron-arch: arm64
          - os: macos-14
            arch: x64
            rust-artifact: rust-macOS-x64
            electron-arch: x64
    runs-on: ${{ matrix.os }}
    name: Package · macOS ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Download Rust binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.rust-artifact }}
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/screenerbot

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      # The packaged app carries its own revision (written by the forge
      # generateAssets hook). Assert it matches what the manifest will publish —
      # a mismatch would make every release look like a shell change and quietly
      # disable silent updates.
      - name: Stamp and verify shell revision
        shell: bash
        working-directory: electron
        run: |
          node tools/shell-revision.js --write
          BAKED="$(node -p "require('./src/shell_revision.json').revision")"
          [ "$BAKED" = "${{ needs.prepare.outputs.shell_revision }}" ] || {
            echo "Shell revision drift: packaged $BAKED, manifest ${{ needs.prepare.outputs.shell_revision }}" >&2
            exit 1
          }

      - name: Build Electron app
        working-directory: electron
        run: npx electron-forge make --arch=${{ matrix.electron-arch }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find electron/out/make -name "*.dmg" -exec cp {} dist/ \;
          find electron/out/make -name "*.zip" -exec cp {} dist/ \;
          # Rename to standard naming convention
          cd dist
          for f in *.dmg; do
            [ -f "$f" ] && mv "$f" "ScreenerBot-${{ needs.prepare.outputs.version }}-macOS-${{ matrix.arch }}.dmg" 2>/dev/null || true
          done
          for f in *.zip; do
            [ -f "$f" ] && mv "$f" "ScreenerBot-${{ needs.prepare.outputs.version }}-macOS-${{ matrix.arch }}.zip" 2>/dev/null || true
          done
          ls -la

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-macOS-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  # ===========================================================================
  # Package Electron app for Linux
  # ===========================================================================

  package-linux:
    needs: [prepare, build-rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust-artifact: rust-Linux-x64
            electron-arch: x64
          - arch: arm64
            rust-artifact: rust-Linux-arm64
            electron-arch: arm64
    runs-on: ubuntu-22.04
    name: Package · Linux ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Download Rust binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.rust-artifact }}
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/screenerbot

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot rpm

      # arm64 electron packaging requires additional setup
      - name: Install arm64 packaging dependencies
        if: matrix.arch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      # The packaged app carries its own revision (written by the forge
      # generateAssets hook). Assert it matches what the manifest will publish —
      # a mismatch would make every release look like a shell change and quietly
      # disable silent updates.
      - name: Stamp and verify shell revision
        shell: bash
        working-directory: electron
        run: |
          node tools/shell-revision.js --write
          BAKED="$(node -p "require('./src/shell_revision.json').revision")"
          [ "$BAKED" = "${{ needs.prepare.outputs.shell_revision }}" ] || {
            echo "Shell revision drift: packaged $BAKED, manifest ${{ needs.prepare.outputs.shell_revision }}" >&2
            exit 1
          }

      - name: Build Electron app
        working-directory: electron
        run: npx electron-forge make --arch=${{ matrix.electron-arch }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find electron/out/make -name "*.deb" -exec cp {} dist/ \;
          find electron/out/make -name "*.zip" -exec cp {} dist/ \;
          # Rename to standard naming convention
          cd dist
          for f in *.deb; do
            [ -f "$f" ] && mv "$f" "ScreenerBot-${{ needs.prepare.outputs.version }}-Linux-${{ matrix.arch }}.deb" 2>/dev/null || true
          done
          for f in *.zip; do
            [ -f "$f" ] && mv "$f" "ScreenerBot-${{ needs.prepare.outputs.version }}-Linux-${{ matrix.arch }}.zip" 2>/dev/null || true
          done
          ls -la

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-Linux-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  # ===========================================================================
  # Package Electron app for Windows
  # ===========================================================================

  package-windows:
    needs: [prepare, build-rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust-artifact: rust-Windows-x64
            electron-arch: x64
          - arch: arm64
            rust-artifact: rust-Windows-arm64
            electron-arch: arm64
    runs-on: windows-latest
    name: Package · Windows ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Download Rust binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.rust-artifact }}
          path: target/release/

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      # The packaged app carries its own revision (written by the forge
      # generateAssets hook). Assert it matches what the manifest will publish —
      # a mismatch would make every release look like a shell change and quietly
      # disable silent updates.
      - name: Stamp and verify shell revision
        shell: bash
        working-directory: electron
        run: |
          node tools/shell-revision.js --write
          BAKED="$(node -p "require('./src/shell_revision.json').revision")"
          [ "$BAKED" = "${{ needs.prepare.outputs.shell_revision }}" ] || {
            echo "Shell revision drift: packaged $BAKED, manifest ${{ needs.prepare.outputs.shell_revision }}" >&2
            exit 1
          }

      - name: Build Electron app
        working-directory: electron
        run: npx electron-forge make --arch=${{ matrix.electron-arch }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find electron/out/make -name "*.msi" -exec cp {} dist/ \; 2>/dev/null || true
          find electron/out/make -name "*.zip" -exec cp {} dist/ \;
          # Rename to standard naming convention
          cd dist
          for f in *.msi; do
            [ -f "$f" ] && mv "$f" "ScreenerBot-${{ needs.prepare.outputs.version }}-Windows-${{ matrix.arch }}.msi" 2>/dev/null || true
          done
          for f in *.zip; do
            [ -f "$f" ] && mv "$f" "ScreenerBot-${{ needs.prepare.outputs.version }}-Windows-${{ matrix.arch }}.zip" 2>/dev/null || true
          done
          ls -la

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-Windows-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  # ===========================================================================
  # Create GitHub Release (auto on tag push; optional on manual dispatch)
  # ===========================================================================

  release:
    if: ${{ needs.prepare.outputs.do_release == 'true' }}
    needs: [prepare, package-macos, package-linux, package-windows, build-rust]
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/

      - name: Organize release files
        run: |
          mkdir -p release
          # Copy all packaged artifacts
          find artifacts/package-* -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" -o -name "*.msi" \) -exec cp {} release/ \;
          # Copy headless tarballs
          find artifacts/headless-* -type f -name "*.tar.gz" -exec cp {} release/ \;
          # Copy core artifacts — the payload of a silent update
          find artifacts/core-* -type f -name "*-core.gz" -exec cp {} release/ \;
          echo "Release artifacts:"
          ls -la release/

      # The update manifest is the only record of which Electron shell a release
      # was built with, and of the digests of its core artifacts. Without it a
      # client can never prove the shell is unchanged, so it falls back to the
      # full installer — which is why this is generated from the build's own
      # outputs rather than written by hand.
      - name: Build update manifest
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const version = process.argv[1].replace(/^v/, '');
            const shellRevision = process.argv[2];
            const core = {};
            for (const dir of fs.readdirSync('artifacts').filter((d) => d.startsWith('core-'))) {
              const meta = JSON.parse(fs.readFileSync(path.join('artifacts', dir, 'core-meta.json'), 'utf8'));
              const { platform, ...artifact } = meta;
              core[platform] = artifact;
            }
            const manifest = { schema: 1, version, shellRevision, core };
            const name = \`ScreenerBot-v\${version}-update-manifest.json\`;
            fs.writeFileSync(path.join('release', name), JSON.stringify(manifest, null, 2) + '\n');
            console.log(JSON.stringify(manifest, null, 2));
          " "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.shell_revision }}"

      - name: Enforce complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ needs.prepare.outputs.version }} already exists; published versions are immutable" >&2
            exit 1
          fi
          cd release
          VERSION="${{ needs.prepare.outputs.version }}"
          expected="$(printf '%s\n' \
            "ScreenerBot-${VERSION}-Linux-arm64-core.gz" \
            "ScreenerBot-${VERSION}-Linux-arm64-headless.tar.gz" \
            "ScreenerBot-${VERSION}-Linux-arm64.deb" \
            "ScreenerBot-${VERSION}-Linux-arm64.zip" \
            "ScreenerBot-${VERSION}-Linux-x64-core.gz" \
            "ScreenerBot-${VERSION}-Linux-x64-headless.tar.gz" \
            "ScreenerBot-${VERSION}-Linux-x64.deb" \
            "ScreenerBot-${VERSION}-Linux-x64.zip" \
            "ScreenerBot-${VERSION}-macOS-arm64-core.gz" \
            "ScreenerBot-${VERSION}-macOS-arm64.dmg" \
            "ScreenerBot-${VERSION}-macOS-arm64.zip" \
            "ScreenerBot-${VERSION}-macOS-x64-core.gz" \
            "ScreenerBot-${VERSION}-macOS-x64.dmg" \
            "ScreenerBot-${VERSION}-macOS-x64.zip" \
            "ScreenerBot-${VERSION}-Windows-arm64-core.gz" \
            "ScreenerBot-${VERSION}-Windows-arm64.msi" \
            "ScreenerBot-${VERSION}-Windows-arm64.zip" \
            "ScreenerBot-${VERSION}-Windows-x64-core.gz" \
            "ScreenerBot-${VERSION}-Windows-x64.msi" \
            "ScreenerBot-${VERSION}-Windows-x64.zip" \
            "ScreenerBot-${VERSION}-update-manifest.json" | sort)"
          actual="$(find . -maxdepth 1 -type f -exec basename {} \; | sort)"
          [ "$actual" = "$expected" ] || {
            echo "Release asset matrix is incomplete or contains unexpected files" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          }
          sha256sum ScreenerBot-* > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          draft: true
          generate_release_notes: true
          files: release/*

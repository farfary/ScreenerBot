<!-- Onboarding Flow - First-time user introduction -->
<div id="onboardingScreen" class="onboarding-screen" style="display: none">
  <!-- Window Title Bar (Drag Region) -->
  <div class="window-titlebar"></div>

  <!-- Hero Section (Logo & Brand) -->
  <div class="onboarding-hero">
    <img src="/assets/logo.svg" data-l10n-id="shell-brand-logo" class="onboarding-logo" />
    <div class="onboarding-brand-container">
      <span class="onboarding-brand" data-l10n-id="shell-brand-name"></span>
      <span class="onboarding-version" id="onboarding-version"></span>
    </div>
  </div>

  <!-- Main content with slides -->
  <main class="onboarding-content">
    <div class="onboarding-slides">
      <!-- Slide 1: Welcome -->
      <div class="onboarding-slide active" data-slide="0">
        <div class="slide-heading">
          <i class="slide-icon icon-zap" aria-hidden="true"></i>
          <h2 class="slide-title" data-l10n-id="onboarding-welcome-title"></h2>
        </div>
        <p class="slide-description" data-l10n-id="onboarding-welcome-description"></p>
        <div class="slide-features">
          <div class="slide-feature">
            <i class="slide-feature-icon icon-download"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-welcome-free-title"></h4>
              <p data-l10n-id="onboarding-welcome-free-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-lock"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-welcome-custody-title"></h4>
              <p data-l10n-id="onboarding-welcome-custody-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-activity"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-welcome-engine-title"></h4>
              <p data-l10n-id="onboarding-welcome-engine-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-zap"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-welcome-realtime-title"></h4>
              <p data-l10n-id="onboarding-welcome-realtime-description"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Slide 2: Discover & Filter -->
      <div class="onboarding-slide" data-slide="1">
        <div class="slide-heading">
          <i class="slide-icon icon-search" aria-hidden="true"></i>
          <h2 class="slide-title" data-l10n-id="onboarding-discover-title"></h2>
        </div>
        <p class="slide-description" data-l10n-id="onboarding-discover-description"></p>
        <div class="slide-features">
          <div class="slide-feature">
            <i class="slide-feature-icon icon-scan"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-discover-dex-title"></h4>
              <p data-l10n-id="onboarding-discover-dex-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-list-filter"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-discover-scanner-title"></h4>
              <p data-l10n-id="onboarding-discover-scanner-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-layers"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-discover-intelligence-title"></h4>
              <p data-l10n-id="onboarding-discover-intelligence-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-trending-up"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-discover-price-action-title"></h4>
              <p data-l10n-id="onboarding-discover-price-action-description"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Slide 3: Trade Smart -->
      <div class="onboarding-slide" data-slide="2">
        <div class="slide-heading">
          <i class="slide-icon icon-target" aria-hidden="true"></i>
          <h2 class="slide-title" data-l10n-id="onboarding-trade-title"></h2>
        </div>
        <p class="slide-description" data-l10n-id="onboarding-trade-description"></p>
        <div class="slide-features">
          <div class="slide-feature">
            <i class="slide-feature-icon icon-bot"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-trade-auto-title"></h4>
              <p data-l10n-id="onboarding-trade-auto-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-target"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-trade-strategy-title"></h4>
              <p data-l10n-id="onboarding-trade-strategy-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-git-compare"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-trade-routing-title"></h4>
              <p data-l10n-id="onboarding-trade-routing-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-shield"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-trade-safety-title"></h4>
              <p data-l10n-id="onboarding-trade-safety-description"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Slide 4: Stay Connected -->
      <div class="onboarding-slide" data-slide="3">
        <div class="slide-heading">
          <i class="slide-icon icon-radio" aria-hidden="true"></i>
          <h2 class="slide-title" data-l10n-id="onboarding-connect-title"></h2>
        </div>
        <p class="slide-description" data-l10n-id="onboarding-connect-description"></p>
        <div class="slide-features">
          <div class="slide-feature">
            <i class="slide-feature-icon icon-sparkles"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-connect-assistant-title"></h4>
              <p data-l10n-id="onboarding-connect-assistant-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-send"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-connect-telegram-title"></h4>
              <p data-l10n-id="onboarding-connect-telegram-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-wallet"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-connect-wallets-title"></h4>
              <p data-l10n-id="onboarding-connect-wallets-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-scroll-text"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-connect-events-title"></h4>
              <p data-l10n-id="onboarding-connect-events-description"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Slide 5: ScreenerBot Data -->
      <div class="onboarding-slide" data-slide="4">
        <div class="slide-heading">
          <i class="slide-icon icon-database" aria-hidden="true"></i>
          <h2 class="slide-title" data-l10n-id="onboarding-data-title"></h2>
        </div>
        <p class="slide-description" data-l10n-id="onboarding-data-description"></p>
        <div class="slide-features">
          <div class="slide-feature">
            <i class="slide-feature-icon icon-chart-candlestick"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-data-candles-title"></h4>
              <p data-l10n-id="onboarding-data-candles-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-git-fork"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-data-pools-title"></h4>
              <p data-l10n-id="onboarding-data-pools-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-user-check"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-data-signin-title"></h4>
              <p data-l10n-id="onboarding-data-signin-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-shield-check"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-data-reading-title"></h4>
              <p data-l10n-id="onboarding-data-reading-description"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Slide 6: Your Keys, Your Data -->
      <div class="onboarding-slide" data-slide="5">
        <div class="slide-heading">
          <i class="slide-icon icon-shield" aria-hidden="true"></i>
          <h2 class="slide-title" data-l10n-id="onboarding-privacy-title"></h2>
        </div>
        <p class="slide-description" data-l10n-id="onboarding-privacy-description"></p>
        <div class="slide-features">
          <div class="slide-feature">
            <i class="slide-feature-icon icon-hard-drive"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-privacy-local-title"></h4>
              <p data-l10n-id="onboarding-privacy-local-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-key"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-privacy-wallet-title"></h4>
              <p data-l10n-id="onboarding-privacy-wallet-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-lock"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-privacy-security-title"></h4>
              <p data-l10n-id="onboarding-privacy-security-description"></p>
            </div>
          </div>
          <div class="slide-feature">
            <i class="slide-feature-icon icon-settings"></i>
            <div class="slide-feature-text">
              <h4 data-l10n-id="onboarding-privacy-config-title"></h4>
              <p data-l10n-id="onboarding-privacy-config-description"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer: skip on the left, progress in the centre, navigation on the right -->
  <footer class="onboarding-footer">
    <button
      type="button"
      class="onboarding-setup-shortcut"
      id="onboardingSetupShortcut"
      data-l10n-id="onboarding-setup-shortcut"
    >
      <i class="icon-settings" aria-hidden="true"></i>
      <span data-l10n-id="onboarding-setup-shortcut-label"></span>
    </button>
    <div class="onboarding-progress">
      <button
        type="button"
        class="progress-dot active"
        data-dot="0"
        data-l10n-id="onboarding-progress-dot"
        data-l10n-args='{"number":1}'
      ></button>
      <button
        type="button"
        class="progress-dot"
        data-dot="1"
        data-l10n-id="onboarding-progress-dot"
        data-l10n-args='{"number":2}'
      ></button>
      <button
        type="button"
        class="progress-dot"
        data-dot="2"
        data-l10n-id="onboarding-progress-dot"
        data-l10n-args='{"number":3}'
      ></button>
      <button
        type="button"
        class="progress-dot"
        data-dot="3"
        data-l10n-id="onboarding-progress-dot"
        data-l10n-args='{"number":4}'
      ></button>
      <button
        type="button"
        class="progress-dot"
        data-dot="4"
        data-l10n-id="onboarding-progress-dot"
        data-l10n-args='{"number":5}'
      ></button>
      <button
        type="button"
        class="progress-dot"
        data-dot="5"
        data-l10n-id="onboarding-progress-dot"
        data-l10n-args='{"number":6}'
      ></button>
    </div>
    <div class="onboarding-nav">
      <button
        type="button"
        class="onboarding-btn onboarding-btn-secondary"
        id="onboardingPrev"
        disabled
      >
        <i class="icon-chevron-left" aria-hidden="true"></i>
        <span data-l10n-id="common-action-back"></span>
      </button>
      <button type="button" class="onboarding-btn onboarding-btn-primary" id="onboardingNext">
        <span data-l10n-id="common-action-next"></span>
        <i class="icon-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
  </footer>
</div>

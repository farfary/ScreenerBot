     Copy-trading page - wallet list and figures strip with editor, settings and arm dialogs for managing copy tasks. -->

<div class="copy-page" id="copy-page">
  <header class="copy-strip">
    <div class="copy-strip-title">
      <h1><i class="icon-copy"></i><span data-l10n-id="copy-page-title"></span></h1>
      <span
        class="copy-strip-feature"
        id="copy-feature-label"
        data-l10n-id="copy-page-beta"
        hidden
      ></span>
      <span
        class="copy-strip-state"
        id="copy-system-state"
        aria-live="polite"
        data-l10n-id="copy-strip-loading"
      ></span>
    </div>
    <div class="copy-strip-actions">
      <button
        class="btn btn-outline btn-sm"
        id="copy-global-action"
        type="button"
        data-l10n-id="copy-strip-pause-all"
        disabled
      ></button>
      <button class="btn btn-ghost btn-sm" id="copy-settings-open" type="button">
        <i class="icon-settings"></i> <span data-l10n-id="copy-strip-settings"></span>
      </button>
      <button class="btn btn-primary btn-sm" id="copy-add" type="button" hidden>
        <i class="icon-plus"></i> <span data-l10n-id="copy-strip-add-wallet"></span>
      </button>
    </div>
  </header>

  <div class="copy-load-error" id="copy-load-error" role="alert" hidden></div>

  <section id="copy-setup-gate" hidden></section>

  <section class="copy-onboarding" id="copy-onboarding" hidden>
    <div class="copy-onboarding-copy">
      <h2 data-l10n-id="copy-onboarding-title"></h2>
      <p data-l10n-id="copy-onboarding-body"></p>
      <button class="btn btn-primary" id="copy-onboarding-add" type="button">
        <i class="icon-plus"></i> <span data-l10n-id="copy-onboarding-add"></span>
      </button>
    </div>
    <ol class="copy-onboarding-steps">
      <li>
        <strong data-l10n-id="copy-onboarding-observe"></strong>
        <span data-l10n-id="copy-onboarding-observe-detail"></span>
      </li>
      <li>
        <strong data-l10n-id="copy-onboarding-evaluate"></strong>
        <span data-l10n-id="copy-onboarding-evaluate-detail"></span>
      </li>
      <li>
        <strong data-l10n-id="copy-onboarding-arm"></strong>
        <span data-l10n-id="copy-onboarding-arm-detail"></span>
      </li>
    </ol>
  </section>

  <div class="copy-main" id="copy-main" hidden>
    <section class="copy-figures" id="copy-figures" data-l10n-id="copy-figures-label"></section>
    <div class="copy-body">
      <aside class="copy-list" data-l10n-id="copy-list-label">
        <div class="copy-list-head">
          <div class="copy-list-title">
            <h2 data-l10n-id="copy-list-title"></h2>
            <span id="copy-list-count">—</span>
          </div>
          <button class="btn btn-ghost btn-sm" id="copy-compare-open" type="button">
            <i class="icon-chart-bar"></i> <span data-l10n-id="copy-list-compare"></span>
          </button>
        </div>
        <div class="copy-list-sort" id="copy-list-sort"></div>
        <div class="copy-list-rows" id="copy-list-rows"></div>
      </aside>
      <main class="copy-workspace" id="copy-workspace"></main>
      <section
        class="copy-compare"
        id="copy-compare"
        data-l10n-id="copy-compare-label"
        hidden
      ></section>
    </div>
  </div>

  <div class="modal-overlay hidden copy-dialog" id="copy-editor">
    <div
      class="modal-dialog copy-editor-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="copy-editor-title"
    >
      <div class="modal-header">
        <div class="copy-dialog-title">
          <h2 id="copy-editor-title" data-l10n-id="copy-editor-title-add"></h2>
          <span id="copy-editor-sub" data-l10n-id="copy-editor-sub-add"></span>
        </div>
        <button
          class="modal-close"
          type="button"
          data-dialog-close
          data-l10n-id="copy-dialog-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <ol class="copy-steps" id="copy-editor-steps"></ol>
      <div class="modal-body copy-editor-body" id="copy-editor-body"></div>
      <div class="copy-dialog-footer">
        <small class="copy-dialog-error" id="copy-editor-error" aria-live="polite"></small>
        <button
          class="btn btn-secondary"
          type="button"
          id="copy-editor-back"
          data-l10n-id="common-action-back"
        ></button>
        <button
          class="btn btn-secondary"
          type="button"
          id="copy-editor-next"
          data-l10n-id="common-action-next"
        ></button>
        <button
          class="btn btn-primary"
          type="button"
          id="copy-editor-save"
          data-l10n-id="copy-editor-save-create"
        ></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden copy-dialog" id="copy-arm">
    <div
      class="modal-dialog copy-arm-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="copy-arm-title"
    >
      <div class="modal-header">
        <div class="copy-dialog-title">
          <h2 id="copy-arm-title" data-l10n-id="copy-arm-title"></h2>
          <span id="copy-arm-sub" data-l10n-id="copy-arm-sub"></span>
        </div>
        <button
          class="modal-close"
          type="button"
          data-dialog-close
          data-l10n-id="copy-dialog-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body" id="copy-arm-body"></div>
      <div class="copy-dialog-footer">
        <small class="copy-dialog-error" id="copy-arm-error" aria-live="polite"></small>
        <small class="copy-dialog-hint" id="copy-arm-hint"></small>
        <button
          class="btn btn-secondary"
          type="button"
          data-dialog-close
          data-l10n-id="copy-arm-keep-paper"
        ></button>
        <button
          class="btn btn-danger"
          type="button"
          id="copy-arm-confirm"
          data-l10n-id="copy-arm-confirm"
          disabled
        ></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden copy-dialog" id="copy-settings">
    <div
      class="modal-dialog copy-settings-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="copy-settings-title"
    >
      <div class="modal-header">
        <div class="copy-dialog-title">
          <h2 id="copy-settings-title" data-l10n-id="copy-settings-title"></h2>
          <span data-l10n-id="copy-settings-subtitle"></span>
        </div>
        <button
          class="modal-close"
          type="button"
          data-dialog-close
          data-l10n-id="copy-dialog-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <form class="copy-settings-form" id="copy-settings-form">
        <div class="modal-body">
          <label class="copy-switch-row">
            <span class="copy-field-text">
              <strong data-l10n-id="config-copy-trading-require-filter-pass"></strong>
              <small data-config-hint="config-copy-trading-require-filter-pass"></small>
              <small
                class="copy-warning"
                id="copy-settings-filter-warning"
                data-l10n-id="copy-settings-filter-warning"
              ></small>
            </span>
            <span class="toggle"
              ><input id="copy-settings-filter" type="checkbox" /><span class="toggle-track"></span
            ></span>
          </label>
          <label class="copy-switch-row">
            <span class="copy-field-text">
              <strong data-l10n-id="config-copy-trading-latency-kill-switch-enabled"></strong>
              <small data-config-hint="config-copy-trading-latency-kill-switch-enabled"></small>
            </span>
            <span class="toggle"
              ><input id="copy-settings-latency" type="checkbox" /><span class="toggle-track"></span
            ></span>
          </label>
          <div class="copy-fields">
            <label class="copy-field">
              <span data-l10n-id="config-copy-trading-max-arrival-distance-ms"></span>
              <span class="copy-number-row"
                ><input
                  id="copy-settings-delay"
                  type="number"
                  min="0.25"
                  max="30"
                  step="0.25"
                  required /><span
                  class="input-unit"
                  data-l10n-id="copy-settings-unit-seconds"
                ></span
              ></span>
              <small data-config-hint="config-copy-trading-max-arrival-distance-ms"></small>
            </label>
            <label class="copy-field">
              <span data-l10n-id="config-copy-trading-latency-window-size"></span>
              <span class="copy-number-row"
                ><input
                  id="copy-settings-window"
                  type="number"
                  min="3"
                  max="100"
                  step="1"
                  required /><span
                  class="input-unit"
                  data-l10n-id="copy-settings-unit-trades"
                ></span
              ></span>
            </label>
            <label class="copy-field">
              <span data-l10n-id="config-copy-trading-default-slippage-pct"></span>
              <span class="copy-number-row"
                ><input
                  id="copy-settings-slippage"
                  type="number"
                  min="0.1"
                  max="50"
                  step="0.1"
                  required
                /><span class="input-unit">%</span></span
              >
            </label>
            <label class="copy-field">
              <span data-l10n-id="config-copy-trading-max-active-tasks"></span>
              <span class="copy-number-row"
                ><input
                  id="copy-settings-max-tasks"
                  type="number"
                  min="1"
                  max="50"
                  step="1"
                  required /><span class="input-unit" data-l10n-id="copy-settings-unit-tasks"></span
              ></span>
              <small data-config-hint="config-copy-trading-max-active-tasks"></small>
            </label>
            <label class="copy-field">
              <span data-l10n-id="config-copy-trading-readiness-min-closed-rounds"></span>
              <span class="copy-number-row"
                ><input
                  id="copy-settings-readiness"
                  type="number"
                  min="1"
                  max="500"
                  step="1"
                  required /><span
                  class="input-unit"
                  data-l10n-id="copy-settings-unit-rounds"
                ></span
              ></span>
              <small data-config-hint="config-copy-trading-readiness-min-closed-rounds"></small>
            </label>
          </div>
        </div>
        <div class="copy-dialog-footer">
          <small class="copy-dialog-error" id="copy-settings-error" aria-live="polite"></small>
          <button
            class="btn btn-secondary"
            type="button"
            data-dialog-close
            data-l10n-id="common-action-cancel"
          ></button>
          <button class="btn btn-primary" type="submit" data-l10n-id="copy-settings-save"></button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay hidden copy-dialog" id="copy-profile">
    <div
      class="modal-dialog copy-profile-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="copy-profile-title"
    >
      <div class="modal-header">
        <div class="copy-dialog-title">
          <h2 id="copy-profile-title" data-l10n-id="copy-profile-title"></h2>
          <span id="copy-profile-sub" data-l10n-id="copy-profile-sub"></span>
        </div>
        <button
          class="modal-close"
          type="button"
          data-dialog-close
          data-l10n-id="copy-dialog-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body" id="copy-profile-body"></div>
      <div class="copy-dialog-footer">
        <small class="copy-dialog-error" id="copy-profile-error" aria-live="polite"></small>
        <button
          class="btn btn-secondary"
          type="button"
          data-dialog-close
          data-l10n-id="common-action-close"
        ></button>
        <button
          class="btn btn-primary"
          type="button"
          id="copy-profile-copy"
          data-l10n-id="copy-profile-copy"
        ></button>
      </div>
    </div>
  </div>
</div>

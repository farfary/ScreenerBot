          <i class="icon-trash-2"></i>

          <div class="tool-title-row">
            <h1 id="tool-title" data-l10n-id="tools-tool-wallet-cleanup-title"></h1>
          </div>
          <p id="tool-description" data-l10n-id="tools-tool-wallet-cleanup-description"></p>
        </div>
      </div>
      <div class="header-right">
        <div class="header-actions" id="tool-actions">
          <!-- Tool-specific actions injected here -->
        </div>
        <button
          class="help-btn"
          type="button"
          id="tool-help-btn"
          data-l10n-id="tools-help-button"
        >
          <i class="icon-info"></i>
        </button>
      </div>
    </header>

    <div class="tools-content" id="tools-content">
      <!-- Tool content dynamically loaded here -->
      <div class="tool-placeholder">
        <h3><i class="icon-wrench"></i><span data-l10n-id="tools-placeholder-title"></span></h3>
        <p data-l10n-id="tools-placeholder-subtitle"></p>
        <div class="placeholder-hints">
          <div class="hint-item">
            <i class="icon-zap"></i>
            <span data-l10n-id="tools-placeholder-hint-wallets"></span>

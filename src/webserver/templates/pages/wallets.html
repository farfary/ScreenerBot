     Wallets page - tab panels for main, secondaries, archive and watched wallets, plus the key export and watch dialogs. -->

<div class="wallets-page">
  <!-- Each tab's subject identity, stats, tools and actions live in its DataTable
       toolbar — this page carries no chrome strip of its own. -->

  <!-- Main Content -->
  <main class="wallets-main">
    <div class="wallets-setup-gate hidden" id="wallets-setup-gate"></div>
    <div class="wallets-tab-panels">
      <!-- Main Wallet Tab Panel -->
      <div class="wallet-tab-panel" id="panel-main" data-panel="main">
        <div class="wallets-funding" id="wallets-funding" hidden></div>
        <div id="tokens-datatable-root"></div>
      </div>

      <!-- Secondaries Tab Panel -->
      <div class="wallet-tab-panel hidden" id="panel-secondaries" data-panel="secondaries">
        <div id="secondaries-table-container"></div>
      </div>

      <!-- Archive Tab Panel -->
      <div class="wallet-tab-panel hidden" id="panel-archive" data-panel="archive">
        <div id="archive-table-container"></div>
      </div>

      <!-- Watched Tab Panel -->
      <div class="wallet-tab-panel hidden" id="panel-watched" data-panel="watched">
        <div id="watched-wallets-root" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <!-- Watch Wallet Modal -->
  <div class="modal-overlay hidden" id="watch-wallet-modal">
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h2><i class="icon-eye"></i> <span data-l10n-id="wallets-watch-add-title"></span></h2>
        <button
          class="modal-close"
          type="button"
          id="watch-modal-close"
          data-l10n-id="wallets-modal-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <form class="wallet-form" id="watched-wallet-form" novalidate>
          <div class="form-group">
            <label for="watched-wallet-address">
              <span data-l10n-id="wallets-watch-add-address"></span>
              <span class="required">*</span>
            </label>
            <input dir="ltr"
              type="text"
              id="watched-wallet-address"
              name="address"
              data-l10n-id="wallets-watch-add-address-input"
              autocomplete="off"
              spellcheck="false"
              required
            />
            <small data-l10n-id="wallets-watch-add-address-hint"></small>
            <small class="form-error hidden" id="watched-wallet-address-error" aria-live="polite">
            </small>
          </div>
          <div class="form-group">
            <label for="watched-wallet-label" data-l10n-id="wallets-watch-add-label"></label>
            <input
              type="text"
              id="watched-wallet-label"
              name="label"
              data-l10n-id="wallets-watch-add-label-input"
              maxlength="60"
            />
          </div>
          <div class="form-actions">
            <button
              type="button"
              class="btn"
              id="watch-cancel-btn"
              data-l10n-id="common-action-cancel"
            ></button>
            <button type="submit" class="btn btn-primary">
              <i class="icon-plus"></i> <span data-l10n-id="wallets-watch-add-submit"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="watch-budget-modal">
    <div
      class="modal-dialog modal-sm"
      role="dialog"
      aria-modal="true"
      aria-labelledby="watch-budget-title"
    >
      <div class="modal-header">
        <h2 id="watch-budget-title" data-l10n-id="wallets-watch-budget-title-options"></h2>
        <button
          class="modal-close"
          type="button"
          id="watch-budget-close"
          data-l10n-id="wallets-watch-budget-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <form class="wallet-form" id="watch-budget-form">
        <div class="modal-body">
          <div class="form-group watch-helius-option" id="watch-helius-option">
            <p id="watch-helius-description"></p>
            <button
              type="button"
              class="btn"
              id="watch-helius-action"
              data-l10n-id="wallets-watch-helius-allow"
            ></button>
          </div>
          <div class="form-group">
            <label
              id="watch-page-budget-label"
              for="watch-page-budget"
              data-l10n-id="wallets-watch-budget-label-signatures"
            ></label>
            <input
              id="watch-page-budget"
              type="number"
              min="500"
              max="5000"
              step="100"
              aria-describedby="watch-budget-hint"
              required
            />
            <small id="watch-budget-hint"></small>
          </div>
          <div class="form-group hidden" id="watch-budget-resume-notice">
            <p data-l10n-id="wallets-watch-budget-resume-notice"></p>
            <p data-l10n-id="wallets-watch-budget-resume-tasks"></p>
            <label class="checkbox-label"
              ><input id="watch-budget-ack" type="checkbox" /><span
                data-l10n-id="wallets-watch-budget-resume-ack"
              ></span
            ></label>
          </div>
          <small class="form-error hidden" id="watch-budget-error" aria-live="polite"></small>
          <div class="form-actions">
            <button
              type="button"
              class="btn"
              id="watch-budget-cancel"
              data-l10n-id="common-action-cancel"
            ></button>
            <button
              type="submit"
              class="btn btn-primary"
              id="watch-budget-save"
              data-l10n-id="wallets-watch-budget-save"
              disabled
            ></button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Export Key Modal -->
  <div class="modal-overlay hidden" id="export-modal">
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h2><i class="icon-key"></i> <span data-l10n-id="wallets-export-title"></span></h2>
        <button
          class="modal-close"
          type="button"
          id="export-modal-close"
          data-l10n-id="wallets-modal-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="danger-banner">
          <i class="icon-triangle-alert"></i>
          <div>
            <strong data-l10n-id="wallets-export-warning-title"></strong>
            <p data-l10n-id="wallets-export-warning-body"></p>
          </div>
        </div>
        <div class="export-key-display hidden" id="export-key-display">
          <label data-l10n-id="wallets-export-key-label"></label>
          <div class="key-display">
            <code id="exported-key" dir="ltr">...</code>
            <button
              type="button"
              class="btn-icon"
              id="copy-key-btn"
              data-l10n-id="wallets-export-copy"
            >
              <i class="icon-copy"></i>
            </button>
          </div>
        </div>
        <div class="form-actions">
          <button
            type="button"
            class="btn"
            id="export-cancel-btn"
            data-l10n-id="common-action-cancel"
          ></button>
          <button type="button" class="btn btn-danger" id="confirm-export-btn">
            <i class="icon-lock-open"></i> <span data-l10n-id="wallets-export-reveal"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

     Wallets page - tab panels for the trading wallet, the other wallets and the watched wallets, plus the watch dialogs; the key export is the shared wallet key dialog. -->

<div class="wallets-page">
  <!-- Each tab's subject identity, stats, tools and actions live in its DataTable
       toolbar — this page carries no chrome strip of its own. -->

  <!-- Main Content -->
  <main class="wallets-main">
    <div class="wallets-access-gate" hidden id="wallets-access-gate"></div>
    <div class="wallets-tab-panels">
      <!-- Main Wallet Tab Panel -->
      <div class="wallet-tab-panel" id="panel-main" data-panel="main">
        <div id="tokens-datatable-root"></div>
      </div>

      <!-- Other Wallets Tab Panel -->
      <div class="wallet-tab-panel" hidden id="panel-other" data-panel="other">
        <div id="other-wallets-table-container"></div>
      </div>

      <!-- Watched Tab Panel -->
      <div class="wallet-tab-panel" hidden id="panel-watched" data-panel="watched">
        <div class="wallets-access-gate" hidden id="watched-access-gate"></div>
        <div id="watched-wallets-root" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <!-- Watch Wallet Modal -->
  <div class="modal-overlay" hidden id="watch-wallet-modal">
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h2><i class="icon-eye"></i> <span data-l10n-id="wallets-watch-add-title"></span></h2>
        <button
          class="modal-close"
          type="button"
          id="watch-modal-close"
          data-dialog-close
          data-l10n-id="wallets-modal-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <form class="wallet-form" id="watched-wallet-form" novalidate>
          <div class="form-group">
            <label for="watched-wallet-address">
              <span data-l10n-id="wallets-watch-add-address"></span>
              <span class="required">*</span>
            </label>
            <input
              dir="ltr"
              type="text"
              id="watched-wallet-address"
              name="address"
              data-l10n-id="wallets-watch-add-address-input"
              autocomplete="off"
              spellcheck="false"
              required
            />
            <small data-l10n-id="wallets-watch-add-address-hint"></small>
            <small class="form-error" hidden id="watched-wallet-address-error" aria-live="polite">
            </small>
          </div>
          <div class="form-group">
            <label for="watched-wallet-label" data-l10n-id="wallets-watch-add-label"></label>
            <input
              type="text"
              id="watched-wallet-label"
              name="label"
              data-l10n-id="wallets-watch-add-label-input"
              maxlength="60"
            />
          </div>
          <div class="form-actions">
            <button
              type="button"
              class="btn btn-secondary"
              id="watch-cancel-btn"
              data-dialog-close
              data-l10n-id="common-action-cancel"
            ></button>
            <button type="submit" class="btn btn-primary">
              <i class="icon-plus"></i> <span data-l10n-id="wallets-watch-add-submit"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-overlay" hidden id="watch-options-modal">
    <div
      class="modal-dialog modal-sm"
      role="dialog"
      aria-modal="true"
      aria-labelledby="watch-options-title"
    >
      <div class="modal-header">
        <h2 id="watch-options-title" data-l10n-id="wallets-watch-options-title"></h2>
        <button
          class="modal-close"
          type="button"
          id="watch-options-close"
          data-dialog-close
          data-l10n-id="wallets-watch-options-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group watch-helius-option">
          <p id="watch-helius-description"></p>
          <button
            type="button"
            class="btn btn-secondary"
            id="watch-helius-action"
            data-l10n-id="wallets-watch-helius-allow"
          ></button>
        </div>
      </div>
    </div>
  </div>
</div>

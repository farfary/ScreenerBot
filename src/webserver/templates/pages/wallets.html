     Wallets page - tab panels for main, secondaries, archive and watched wallets, plus add, export and bulk import dialogs. -->

<div class="wallets-page">
  <!-- Each tab's subject identity, stats, tools and actions live in its DataTable
       toolbar — this page carries no chrome strip of its own. -->

  <!-- Main Content -->
  <main class="wallets-main">
    <div class="wallets-setup-gate hidden" id="wallets-setup-gate"></div>
    <div class="wallets-tab-panels">
      <!-- Main Wallet Tab Panel -->
      <div class="wallet-tab-panel" id="panel-main" data-panel="main">
        <div id="tokens-datatable-root"></div>
      </div>

      <!-- Secondaries Tab Panel -->
      <div class="wallet-tab-panel hidden" id="panel-secondaries" data-panel="secondaries">
        <div id="secondaries-table-container"></div>
      </div>

      <!-- Archive Tab Panel -->
      <div class="wallet-tab-panel hidden" id="panel-archive" data-panel="archive">
        <div id="archive-table-container"></div>
      </div>

      <!-- Watched Tab Panel -->
      <div class="wallet-tab-panel hidden" id="panel-watched" data-panel="watched">
        <div id="watched-wallets-root" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <!-- Add Wallet Modal -->
  <div class="modal-overlay hidden" id="add-wallet-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2><i class="icon-wallet"></i> <span data-l10n-id="wallets-add-title"></span></h2>
        <button
          class="modal-close"
          type="button"
          id="modal-close-btn"
          data-l10n-id="wallets-modal-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <!-- Tab Navigation -->
        <div class="modal-tabs">
          <button class="modal-tab active" type="button" data-tab="create">
            <i class="icon-circle-plus"></i> <span data-l10n-id="wallets-add-tab-create"></span>
          </button>
          <button class="modal-tab" type="button" data-tab="import">
            <i class="icon-download"></i> <span data-l10n-id="wallets-add-tab-import"></span>
          </button>
        </div>

        <!-- Create Wallet Form -->
        <div class="modal-tab-content active" id="create-tab-content">
          <form class="wallet-form" id="create-wallet-form">
            <div class="form-group">
              <label for="create-name"
                ><span data-l10n-id="wallets-field-name"></span>
                <span class="required">*</span></label
              >
              <input
                type="text"
                id="create-name"
                data-l10n-id="wallets-create-name-input"
                required
                maxlength="50"
              />
              <small data-l10n-id="wallets-create-name-hint"></small>
            </div>
            <div class="form-group">
              <label for="create-notes" data-l10n-id="wallets-field-notes"></label>
              <textarea
                id="create-notes"
                data-l10n-id="wallets-create-notes-input"
                rows="2"
                maxlength="200"
              ></textarea>
            </div>
            <div class="form-actions">
              <button
                type="button"
                class="btn"
                id="create-cancel-btn"
                data-l10n-id="common-action-cancel"
              ></button>
              <button type="submit" class="btn primary">
                <i class="icon-plus"></i> <span data-l10n-id="wallets-create-submit"></span>
              </button>
            </div>
          </form>
        </div>

        <!-- Import Wallet Form -->
        <div class="modal-tab-content" id="import-tab-content">
          <div class="warning-banner">
            <i class="icon-triangle-alert"></i>
            <div>
              <strong data-l10n-id="wallets-import-warning-title"></strong>
              <p data-l10n-id="wallets-import-warning-body"></p>
            </div>
          </div>
          <form class="wallet-form" id="import-wallet-form">
            <div class="form-group">
              <label for="import-name"
                ><span data-l10n-id="wallets-field-name"></span>
                <span class="required">*</span></label
              >
              <input
                type="text"
                id="import-name"
                data-l10n-id="wallets-import-name-input"
                required
                maxlength="50"
              />
            </div>
            <div class="form-group">
              <label for="import-private-key"
                ><span data-l10n-id="wallets-field-private-key"></span>
                <span class="required">*</span></label
              >
              <div class="password-input-wrapper" dir="ltr">
                <textarea dir="ltr"
                  id="import-private-key"
                  data-l10n-id="wallets-import-key-input"
                  rows="3"
                  required
                  class="secure-input"
                ></textarea>
                <button
                  type="button"
                  class="toggle-visibility"
                  data-target="import-private-key"
                  data-l10n-id="wallets-import-key-toggle"
                  aria-pressed="false"
                >
                  <i class="icon-eye"></i>
                </button>
              </div>
              <small data-l10n-id="wallets-import-key-hint"></small>
            </div>
            <div class="form-group">
              <label for="import-notes" data-l10n-id="wallets-field-notes"></label>
              <textarea
                id="import-notes"
                data-l10n-id="wallets-import-notes-input"
                rows="2"
                maxlength="200"
              ></textarea>
            </div>
            <div class="form-actions">
              <button
                type="button"
                class="btn"
                id="import-cancel-btn"
                data-l10n-id="common-action-cancel"
              ></button>
              <button type="submit" class="btn primary">
                <i class="icon-download"></i> <span data-l10n-id="wallets-import-submit"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Watch Wallet Modal -->
  <div class="modal-overlay hidden" id="watch-wallet-modal">
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h2><i class="icon-eye"></i> <span data-l10n-id="wallets-watch-add-title"></span></h2>
        <button
          class="modal-close"
          type="button"
          id="watch-modal-close"
          data-l10n-id="wallets-modal-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <form class="wallet-form" id="watched-wallet-form" novalidate>
          <div class="form-group">
            <label for="watched-wallet-address">
              <span data-l10n-id="wallets-watch-add-address"></span>
              <span class="required">*</span>
            </label>
            <input dir="ltr"
              type="text"
              id="watched-wallet-address"
              name="address"
              data-l10n-id="wallets-watch-add-address-input"
              autocomplete="off"
              spellcheck="false"
              required
            />
            <small data-l10n-id="wallets-watch-add-address-hint"></small>
            <small class="form-error hidden" id="watched-wallet-address-error" aria-live="polite">
            </small>
          </div>
          <div class="form-group">
            <label for="watched-wallet-label" data-l10n-id="wallets-watch-add-label"></label>
            <input
              type="text"
              id="watched-wallet-label"
              name="label"
              data-l10n-id="wallets-watch-add-label-input"
              maxlength="60"
            />
          </div>
          <div class="form-actions">
            <button
              type="button"
              class="btn"
              id="watch-cancel-btn"
              data-l10n-id="common-action-cancel"
            ></button>
            <button type="submit" class="btn primary">
              <i class="icon-plus"></i> <span data-l10n-id="wallets-watch-add-submit"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="watch-budget-modal">
    <div
      class="modal-dialog modal-sm"
      role="dialog"
      aria-modal="true"
      aria-labelledby="watch-budget-title"
    >
      <div class="modal-header">
        <h2 id="watch-budget-title" data-l10n-id="wallets-watch-budget-title-options"></h2>
        <button
          class="modal-close"
          type="button"
          id="watch-budget-close"
          data-l10n-id="wallets-watch-budget-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <form class="wallet-form" id="watch-budget-form">
        <div class="modal-body">
          <div class="form-group watch-helius-option" id="watch-helius-option">
            <p id="watch-helius-description"></p>
            <button
              type="button"
              class="btn"
              id="watch-helius-action"
              data-l10n-id="wallets-watch-helius-allow"
            ></button>
          </div>
          <div class="form-group">
            <label
              id="watch-page-budget-label"
              for="watch-page-budget"
              data-l10n-id="wallets-watch-budget-label-signatures"
            ></label>
            <input
              id="watch-page-budget"
              type="number"
              min="500"
              max="5000"
              step="100"
              aria-describedby="watch-budget-hint"
              required
            />
            <small id="watch-budget-hint"></small>
          </div>
          <div class="form-group hidden" id="watch-budget-resume-notice">
            <p data-l10n-id="wallets-watch-budget-resume-notice"></p>
            <p data-l10n-id="wallets-watch-budget-resume-tasks"></p>
            <label class="checkbox-label"
              ><input id="watch-budget-ack" type="checkbox" /><span
                data-l10n-id="wallets-watch-budget-resume-ack"
              ></span
            ></label>
          </div>
          <small class="form-error hidden" id="watch-budget-error" aria-live="polite"></small>
          <div class="form-actions">
            <button
              type="button"
              class="btn"
              id="watch-budget-cancel"
              data-l10n-id="common-action-cancel"
            ></button>
            <button
              type="submit"
              class="btn btn-primary"
              id="watch-budget-save"
              data-l10n-id="wallets-watch-budget-save"
              disabled
            ></button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Export Key Modal -->
  <div class="modal-overlay hidden" id="export-modal">
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h2><i class="icon-key"></i> <span data-l10n-id="wallets-export-title"></span></h2>
        <button
          class="modal-close"
          type="button"
          id="export-modal-close"
          data-l10n-id="wallets-modal-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="danger-banner">
          <i class="icon-triangle-alert"></i>
          <div>
            <strong data-l10n-id="wallets-export-warning-title"></strong>
            <p data-l10n-id="wallets-export-warning-body"></p>
          </div>
        </div>
        <div class="export-key-display hidden" id="export-key-display">
          <label data-l10n-id="wallets-export-key-label"></label>
          <div class="key-display">
            <code id="exported-key" dir="ltr">...</code>
            <button
              type="button"
              class="btn-icon"
              id="copy-key-btn"
              data-l10n-id="wallets-export-copy"
            >
              <i class="icon-copy"></i>
            </button>
          </div>
        </div>
        <div class="form-actions">
          <button
            type="button"
            class="btn"
            id="export-cancel-btn"
            data-l10n-id="common-action-cancel"
          ></button>
          <button type="button" class="btn danger" id="confirm-export-btn">
            <i class="icon-lock-open"></i> <span data-l10n-id="wallets-export-reveal"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Archive Confirmation Modal -->
  <div class="modal-overlay hidden" id="archive-modal">
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h2><i class="icon-archive"></i> <span data-l10n-id="wallets-archive-title"></span></h2>
        <button
          class="modal-close"
          type="button"
          id="archive-modal-close"
          data-l10n-id="wallets-modal-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <p class="confirm-text" id="archive-confirm-text"></p>
        <p class="info-text" data-l10n-id="wallets-archive-note"></p>
        <div class="form-actions">
          <button
            type="button"
            class="btn"
            id="archive-cancel-btn"
            data-l10n-id="format-no"
          ></button>
          <button type="button" class="btn primary" id="confirm-archive-btn">
            <i class="icon-archive"></i> <span data-l10n-id="wallets-archive-confirm"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay hidden" id="delete-modal">
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h2><i class="icon-trash-2"></i> <span data-l10n-id="wallets-delete-title"></span></h2>
        <button
          class="modal-close"
          type="button"
          id="delete-modal-close"
          data-l10n-id="wallets-modal-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="danger-banner">
          <i class="icon-triangle-alert"></i>
          <div>
            <strong data-l10n-id="wallets-delete-warning-title"></strong>
            <p data-l10n-id="wallets-delete-warning-body"></p>
          </div>
        </div>
        <p class="confirm-text" id="delete-confirm-text"></p>
        <div class="form-actions">
          <button
            type="button"
            class="btn"
            id="delete-cancel-btn"
            data-l10n-id="format-no"
          ></button>
          <button type="button" class="btn danger" id="confirm-delete-btn">
            <i class="icon-trash-2"></i> <span data-l10n-id="wallets-delete-confirm"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bulk Import Modal -->
  <div class="modal-overlay hidden" id="bulk-import-modal">
    <div class="modal-dialog modal-lg">
      <div class="modal-header">
        <h2><i class="icon-upload"></i> <span data-l10n-id="wallets-bulk-import-title"></span></h2>
        <button
          class="modal-close"
          type="button"
          id="bulk-import-modal-close"
          data-l10n-id="wallets-modal-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <!-- Step Indicator -->
        <div class="import-steps">
          <div class="import-step active" data-step="1">
            <span class="step-number">1</span>
            <span class="step-label" data-l10n-id="wallets-bulk-step-upload"></span>
          </div>
          <div class="step-connector"></div>
          <div class="import-step" data-step="2">
            <span class="step-number">2</span>
            <span class="step-label" data-l10n-id="wallets-bulk-step-map"></span>
          </div>
          <div class="step-connector"></div>
          <div class="import-step" data-step="3">
            <span class="step-number">3</span>
            <span class="step-label" data-l10n-id="wallets-bulk-step-results"></span>
          </div>
        </div>

        <!-- Step 1: File Upload -->
        <div class="import-step-content" id="import-step-1">
          <div class="warning-banner">
            <i class="icon-triangle-alert"></i>
            <div>
              <strong data-l10n-id="wallets-import-warning-title"></strong>
              <p data-l10n-id="wallets-bulk-import-file-warning-body"></p>
            </div>
          </div>
          <div class="file-dropzone" id="import-dropzone">
            <div class="dropzone-content">
              <i class="icon-cloud-upload"></i>
              <p class="dropzone-title" data-l10n-id="wallets-bulk-drop-title"></p>
              <p class="dropzone-subtitle" data-l10n-id="wallets-bulk-drop-subtitle"></p>
              <span class="dropzone-formats" data-l10n-id="wallets-bulk-drop-formats"></span>
            </div>
            <input type="file" id="import-file-input" accept=".csv,.xlsx,.xls" hidden />
          </div>
          <div class="selected-file hidden" id="selected-file-info">
            <i class="icon-file-text"></i>
            <span id="selected-file-name" dir="auto"></span>
            <button
              type="button"
              class="btn-icon"
              id="clear-file-btn"
              data-l10n-id="wallets-bulk-file-remove"
            >
              <i class="icon-x"></i>
            </button>
          </div>
          <div class="form-actions">
            <button
              type="button"
              class="btn"
              id="import-step1-cancel"
              data-l10n-id="common-action-cancel"
            ></button>
            <button type="button" class="btn primary" id="import-step1-next" disabled>
              <i class="icon-arrow-right"></i> <span data-l10n-id="common-action-next"></span>
            </button>
          </div>
        </div>

        <!-- Step 2: Column Mapping & Preview -->
        <div class="import-step-content hidden" id="import-step-2">
          <div class="column-mapping-section">
            <h4>
              <i class="icon-settings"></i> <span data-l10n-id="wallets-bulk-step-map"></span>
            </h4>
            <p class="mapping-subtitle" data-l10n-id="wallets-bulk-map-subtitle"></p>
            <div class="column-mapping-grid" id="column-mapping-grid">
              <!-- Dynamically populated -->
            </div>
          </div>
          <div class="preview-section">
            <h4>
              <i class="icon-eye"></i> <span data-l10n-id="wallets-bulk-preview-title"></span>
            </h4>
            <div class="preview-table-wrapper" id="preview-table-wrapper">
              <!-- Dynamically populated -->
            </div>
          </div>
          <div class="import-summary" id="import-summary">
            <div class="summary-item valid">
              <i class="icon-circle-check"></i>
              <span
                id="import-summary-valid"
                data-l10n-id="wallets-bulk-summary-valid"
                data-l10n-args='{"count":0}'
                data-l10n-markup
              ></span>
            </div>
            <div class="summary-item invalid">
              <i class="icon-circle-x"></i>
              <span
                id="import-summary-invalid"
                data-l10n-id="wallets-bulk-summary-invalid"
                data-l10n-args='{"count":0}'
                data-l10n-markup
              ></span>
            </div>
            <div class="summary-item duplicate">
              <i class="icon-copy"></i>
              <span
                id="import-summary-duplicate"
                data-l10n-id="wallets-bulk-summary-duplicate"
                data-l10n-args='{"count":0}'
                data-l10n-markup
              ></span>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn" id="import-step2-back">
              <i class="icon-arrow-left"></i> <span data-l10n-id="common-action-back"></span>
            </button>
            <button type="button" class="btn primary" id="import-step2-execute" disabled>
              <i class="icon-upload"></i> <span data-l10n-id="wallets-bulk-import-submit"></span>
            </button>
          </div>
        </div>

        <!-- Step 3: Import Results -->
        <div class="import-step-content hidden" id="import-step-3">
          <div class="import-results-header" id="import-results-header">
            <!-- Dynamically populated with success/error summary -->
          </div>
          <div class="import-results-table-wrapper" id="import-results-table">
            <!-- Dynamically populated -->
          </div>
          <div class="form-actions">
            <button type="button" class="btn primary" id="import-step3-done">
              <i class="icon-check"></i> <span data-l10n-id="wallets-bulk-done"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bulk Export Modal -->
  <div class="modal-overlay hidden" id="bulk-export-modal">
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h2>
          <i class="icon-download"></i> <span data-l10n-id="wallets-bulk-export-title"></span>
        </h2>
        <button
          class="modal-close"
          type="button"
          id="bulk-export-modal-close"
          data-l10n-id="wallets-modal-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <!-- Export Options -->
        <div class="export-options">
          <div class="form-group">
            <label for="export-format" data-l10n-id="wallets-bulk-export-format"></label>
            <select id="export-format" data-custom-select>
              <option value="csv" data-l10n-id="wallets-bulk-export-format-csv"></option>
              <option value="xlsx" data-l10n-id="wallets-bulk-export-format-xlsx"></option>
            </select>
          </div>
          <div class="form-group checkbox-group">
            <label>
              <input type="checkbox" id="export-include-inactive" />
              <span data-l10n-id="wallets-bulk-export-include-archived"></span>
            </label>
          </div>
        </div>

        <!-- Export Without Keys Section -->
        <div class="export-safe-section">
          <div class="info-banner">
            <i class="icon-shield-check"></i>
            <div>
              <strong data-l10n-id="wallets-bulk-export-safe-title"></strong>
              <p data-l10n-id="wallets-bulk-export-safe-body"></p>
            </div>
          </div>
          <button type="button" class="btn primary full-width" id="export-safe-btn">
            <i class="icon-download"></i>
            <span data-l10n-id="wallets-bulk-export-safe-submit"></span>
          </button>
        </div>

        <div class="export-divider">
          <span data-l10n-id="wallets-bulk-export-or"></span>
        </div>

        <!-- Export With Keys Section (Dangerous) -->
        <div class="export-keys-section">
          <div class="danger-banner">
            <i class="icon-triangle-alert"></i>
            <div>
              <strong data-l10n-id="wallets-bulk-export-danger-title"></strong>
              <p data-l10n-id="wallets-bulk-export-danger-body"></p>
            </div>
          </div>
          <button type="button" class="btn danger full-width" id="export-with-keys-btn">
            <i class="icon-lock-open"></i>
            <span data-l10n-id="wallets-bulk-export-danger-submit"></span>
          </button>
        </div>

        <div class="form-actions">
          <button
            type="button"
            class="btn"
            id="bulk-export-cancel-btn"
            data-l10n-id="common-action-cancel"
          ></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Export Keys Confirmation Modal -->
  <div class="modal-overlay hidden" id="export-keys-confirm-modal">
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h2>
          <i class="icon-triangle-alert"></i>
          <span data-l10n-id="wallets-bulk-confirm-title"></span>
        </h2>
        <button
          class="modal-close"
          type="button"
          id="export-keys-confirm-close"
          data-l10n-id="wallets-modal-close"
        >
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="danger-banner">
          <i class="icon-triangle-alert"></i>
          <div>

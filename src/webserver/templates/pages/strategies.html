     Strategy editor page - strategy list sidebar, rule editor and the condition catalog dialog. -->

<div class="strategies-page">
  <!-- Left Sidebar: Strategy Management -->
  <aside class="strategies-sidebar">
    <div class="strategy-filter-bar">
      <button type="button" class="filter-tab active" data-filter="all" data-l10n-id="strategies-filter-all"></button>
      <button type="button" class="filter-tab" data-filter="entry" data-l10n-id="strategies-filter-entry"></button>
      <button type="button" class="filter-tab" data-filter="exit" data-l10n-id="strategies-filter-exit"></button>
    </div>

    <div class="sidebar-content">
      <div class="strategy-list" id="strategy-list">
        <div class="state-view state-view-empty state-view-compact" role="status" aria-live="polite">
          <div class="state-view-heading">
            <i class="state-view-icon icon-file-text" aria-hidden="true"></i>
            <span class="state-view-title" data-l10n-id="strategies-list-empty-title"></span>
          </div>
          <div class="state-view-message" data-l10n-id="strategies-list-empty-hint"></div>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-footer-row">
        <button type="button" class="btn btn-primary flex-1" id="create-strategy">
          <i class="icon-plus"></i> <span data-l10n-id="strategies-new"></span>
        </button>
        <button type="button" class="btn-icon" id="import-strategy" data-l10n-id="strategies-import">
          <i class="icon-download"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Editor Area -->
  <main class="strategy-editor">
    <!-- Toolbar: one row, shown only while a strategy is loaded -->
    <header class="editor-header" id="editor-header">
      <div class="editor-identity">
        <span class="strategy-type-badge entry" id="strategy-type-badge">
          <i class="icon-trending-up"></i> <span data-l10n-id="strategies-type-entry"></span>
        </span>
        <input
          type="text"
          id="strategy-name"
          data-l10n-id="strategies-editor-name"
          class="strategy-name-input"
          spellcheck="false"
        />
        <span class="editor-dirty-dot" id="editor-dirty-dot" data-l10n-id="strategies-editor-dirty"></span>
      </div>
      <div class="editor-controls">
        <button type="button" class="btn btn-sm editor-action editor-action-lead" id="test-strategy">
          <i class="icon-flask-conical" aria-hidden="true"></i>
          <span class="editor-action-label" data-l10n-id="strategies-action-test"></span>
        </button>
        <button type="button" class="btn btn-sm editor-action" id="validate-strategy">
          <i class="icon-circle-check" aria-hidden="true"></i>
          <span class="editor-action-label" data-l10n-id="strategies-action-validate"></span>
        </button>
        <button type="button" class="btn btn-sm editor-action" id="export-strategy">
          <i class="icon-upload" aria-hidden="true"></i>
          <span class="editor-action-label" data-l10n-id="strategies-action-export"></span>
        </button>
        <button type="button" class="btn btn-primary btn-sm editor-save-btn" id="save-strategy">
          <i class="icon-save"></i> <span data-l10n-id="common-action-save"></span>
        </button>
        <label class="toggle editor-active">
          <span data-l10n-id="strategies-editor-active"></span>
          <input type="checkbox" id="strategy-enabled-toggle" />
          <span class="toggle-track"></span>
        </label>
      </div>
    </header>

    <!-- Empty state: shown when no strategy is selected -->
    <div class="editor-placeholder" id="editor-empty">
      <div class="state-view state-view-empty" role="status" aria-live="polite">
        <div class="state-view-heading">
          <i class="state-view-icon icon-square-pen" aria-hidden="true"></i>
          <span class="state-view-message" data-l10n-id="strategies-editor-empty"></span>
        </div>
      </div>
    </div>

    <!-- Scrollable Content Area: the strategy settings, then the root rule group -->
    <div class="editor-scroll-area" id="editor-scroll-area">
      <div class="conditions-container">
        <div class="editor-settings" id="editor-settings">
          <div class="editor-field">
            <label for="strategy-timeframe" data-l10n-id="strategies-editor-timeframe"></label>
            <select id="strategy-timeframe" data-custom-select data-cs-fit-options></select>
          </div>
          <div class="editor-field">
            <label for="strategy-priority" data-l10n-id="strategies-editor-priority"></label>
            <input type="number" id="strategy-priority" min="1" max="100" step="1" />
          </div>
          <div class="editor-field editor-entry-binding-field" id="entry-binding-field" hidden>
            <span
              class="editor-field-label"
              id="entry-binding-label"
              data-l10n-id="strategies-editor-entry-binding-label"
            ></span>
            <button
              type="button"
              class="btn btn-sm editor-panel-toggle"
              id="toggle-entry-binding"
              aria-expanded="false"
              aria-controls="strategy-entry-binding-panel"
              aria-labelledby="entry-binding-label entry-binding-summary"
            >
              <i class="icon-waypoints" aria-hidden="true"></i>
              <span id="entry-binding-summary"></span>
              <i class="icon-chevron-down editor-panel-chevron" aria-hidden="true"></i>
            </button>
          </div>
          <button
            type="button"
            class="btn btn-sm editor-panel-toggle editor-description-toggle"
            id="toggle-description"
            aria-expanded="false"
            aria-controls="strategy-description-panel"
          >
            <i class="icon-file-text" aria-hidden="true"></i>
            <span data-l10n-id="strategies-editor-description"></span>
            <i class="icon-chevron-down editor-panel-chevron" aria-hidden="true"></i>
          </button>
        </div>
        <div class="editor-entry-binding" id="strategy-entry-binding-panel" hidden>
          <p
            class="editor-entry-binding-hint"
            id="strategy-entry-binding-label"
            data-l10n-id="strategies-editor-entry-binding-hint"
          ></p>
          <div
            class="editor-entry-binding-list"
            id="strategy-entry-binding"
            role="group"
            aria-labelledby="strategy-entry-binding-label"
          ></div>
        </div>
        <div class="editor-description" id="strategy-description-panel" hidden>
          <textarea
            id="strategy-description"
            rows="2"
            data-l10n-id="strategies-editor-description-field"
          ></textarea>
        </div>
        <div class="conditions-list" id="conditions-list"></div>
      </div>
    </div>

    <!-- Sticky Footer -->
    <footer class="editor-footer" id="editor-footer">
      <div class="strategy-test-line" id="strategy-test-line" hidden>
        <div class="strategy-test-summary" id="strategy-test-result" aria-live="polite"></div>
        <button
          type="button"
          class="btn-icon strategy-test-close"
          id="strategy-test-close"
          data-l10n-id="strategies-modal-close"
        >
          <i class="icon-x" aria-hidden="true"></i>
        </button>
      </div>
      <button type="button" class="rule-problems" id="rule-problems" hidden></button>
      <div class="editor-footer-actions">
        <button type="button" class="btn btn-outline rule-add-btn" id="add-condition">
          <i class="icon-plus"></i> <span data-l10n-id="strategies-add-condition"></span>
        </button>
        <button type="button" class="btn btn-outline rule-add-btn" id="add-group">
          <i class="icon-plus"></i> <span data-l10n-id="strategies-add-group"></span>
        </button>
      </div>
    </footer>
  </main>

  <!-- Condition Catalog Modal -->
  <div class="modal-overlay condition-catalog-modal" id="condition-catalog-modal" hidden>
    <div
      class="modal-dialog condition-catalog-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="condition-catalog-title"
    >
      <div class="modal-header">
        <h3 id="condition-catalog-title"><i class="icon-puzzle"></i> <span data-l10n-id="strategies-add-condition"></span></h3>
        <button type="button" class="modal-close" id="close-condition-catalog" data-l10n-id="strategies-modal-close">
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body condition-catalog-body">
        <nav class="catalog-rail" id="catalog-categories" data-l10n-id="strategies-catalog-categories"></nav>
        <div class="catalog-main">
          <div class="search-wrapper catalog-search">
            <input
              type="text"
              id="condition-search"
              data-l10n-id="strategies-catalog-search"
              autocomplete="off"
            />
            <i class="icon-search search-icon" aria-hidden="true"></i>
            <button type="button" class="search-clear" id="clear-search" data-l10n-id="strategies-catalog-search-clear"><i class="icon-x" aria-hidden="true"></i></button>
          </div>
          <div class="catalog-list" id="catalog-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Strategy Type Selection Modal -->
  <div class="modal-overlay create-strategy-modal" id="create-strategy-modal" hidden>
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h3><i class="icon-plus"></i> <span data-l10n-id="strategies-create-title"></span></h3>
        <button type="button" class="modal-close" id="create-strategy-close" data-l10n-id="strategies-modal-close">
          <i class="icon-x"></i>
        </button>
      </div>
      <div class="modal-body">
        <p class="modal-desc" data-l10n-id="strategies-create-prompt"></p>
        <div class="strategy-type-cards">
          <button type="button" class="type-card" data-type="ENTRY">
            <span class="type-icon"><i class="icon-trending-up"></i></span>
            <span class="type-name" data-l10n-id="strategies-create-entry-name"></span>
            <span class="type-desc" data-l10n-id="strategies-create-entry-description"></span>
          </button>
          <button type="button" class="type-card" data-type="EXIT">
            <span class="type-icon"><i class="icon-trending-down"></i></span>
            <span class="type-name" data-l10n-id="strategies-create-exit-name"></span>
            <span class="type-desc" data-l10n-id="strategies-create-exit-description"></span>
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancel-create-strategy" data-l10n-id="common-action-cancel"></button>
      </div>
    </div>
  </div>
</div>

<!-- Splash Screen - Shows on every app start -->
<div id="splashScreen" class="splash-screen">
  <div class="splash-content">
    <span class="brand-mark splash-logo" aria-hidden="true"></span>
    <div class="splash-brand" data-l10n-id="shell-brand-name"></div>
    <div class="splash-state" role="status" aria-live="polite">
      <div class="splash-status-row">
        <div class="splash-spinner" aria-hidden="true"></div>
        <div class="splash-status" id="splashStatus" data-l10n-id="shell-splash-starting"></div>
      </div>
      <div class="splash-detail" id="splashDetail"></div>
    </div>
  </div>
  <div class="splash-version" id="splashVersion" dir="ltr"></div>
</div>

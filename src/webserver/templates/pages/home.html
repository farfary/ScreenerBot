     Home dashboard page - portfolio hero with balance and sparkline, monthly P&L calendar and pipeline metrics. -->

<div class="home-dashboard loading">
  <section
    class="home-update-region"
    id="homeUpdateNotice"
    data-l10n-id="updates-notice-region"
    aria-live="polite"
    hidden
  ></section>
  <section class="portfolio-overview" aria-labelledby="portfolioHeading">
    <div class="portfolio-headline">
      <div class="portfolio-primary">
        <div class="hero-heading">
          <h1 class="hero-label" id="portfolioHeading" data-l10n-id="home-portfolio-title"></h1>
          <div class="wallet-identity" id="homeWalletIdentity" hidden>
            <span class="wallet-address" id="homeWalletAddress"></span>
            <div class="wallet-identity-actions">
              <button
                type="button"
                class="wallet-identity-action"
                id="homeWalletCopy"
                data-copy=""
                data-l10n-id="home-wallet-copy"
              >
                <i class="icon-copy" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="wallet-identity-action"
                id="homeWalletQrButton"
                data-l10n-id="home-wallet-qr-open"
                aria-haspopup="dialog"
                aria-expanded="false"
              >
                <i class="icon-qr-code" aria-hidden="true"></i>
              </button>
              <div
                class="wallet-qr-popover"
                id="homeWalletQrPopover"
                role="dialog"
                data-l10n-id="home-wallet-qr-popover"
                hidden
              >
                <div class="wallet-qr-header">
                  <div>
                    <strong data-l10n-id="home-wallet-qr-receive"></strong>
                    <span data-l10n-id="home-wallet-qr-assets"></span>
                  </div>
                  <button
                    type="button"
                    class="wallet-identity-action"
                    id="homeWalletQrClose"
                    data-l10n-id="home-wallet-qr-close"
                  >
                    <i class="icon-x" aria-hidden="true"></i>
                  </button>
                </div>
                <div class="wallet-qr-visual">
                  <span id="homeWalletQrStatus" data-l10n-id="home-wallet-qr-preparing"></span>
                  <img
                    id="homeWalletQrImage"
                    src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
                    data-l10n-id="home-wallet-qr-image"
                    hidden
                  />
                </div>
                <div class="wallet-qr-address" id="homeWalletQrAddress"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="hero-balance" id="walletBalance">—</div>
        <div class="hero-sub">
          <span class="hero-usd" id="walletUsd"></span>
          <span class="hero-change-group">
            <span class="hero-change-label" data-l10n-id="home-portfolio-change-label"></span>
            <span class="hero-change flat" id="homeWalletChange">
              <span class="hero-change-value change-value flat">—</span>
            </span>
          </span>
        </div>
      </div>

      <div class="hero-trend">
        <svg
          class="hero-spark"
          id="heroSpark"
          viewBox="0 0 120 40"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="heroSparkFade" x1="0" y1="0" x2="0" y2="1">
              <stop class="hero-spark-fade-top" offset="0" />
              <stop class="hero-spark-fade-bottom" offset="1" />
            </linearGradient>
          </defs>
          <polygon class="hero-spark-area" id="heroSparkArea" points="" />
          <polyline class="hero-spark-line" id="heroSparkLine" points="" />
        </svg>
        <span class="hero-trend-range" data-l10n-id="home-trend-range"></span>
      </div>
    </div>

    <div class="portfolio-stats">
      <div class="portfolio-stat">
        <span class="hero-stat-label" data-l10n-id="home-stat-available"></span>
        <span class="hero-stat-value" id="heroCash">—</span>
        <span class="hero-stat-sub"></span>
      </div>
      <div class="portfolio-stat">
        <span class="hero-stat-label" data-l10n-id="home-stat-holdings"></span>
        <span class="hero-stat-value" id="heroHoldings">—</span>
        <span class="hero-stat-sub" id="heroHoldingsCount"></span>
      </div>
      <div class="portfolio-stat">
        <span class="hero-stat-label" data-l10n-id="home-stat-open-pnl"></span>
        <span class="hero-stat-value flat" id="heroOpenPnl">—</span>
        <span class="hero-stat-sub" id="heroOpenPnlPercent"></span>
      </div>
      <div class="portfolio-stat">
        <span class="hero-stat-label" data-l10n-id="home-stat-realized-today"></span>
        <span class="hero-stat-value flat" id="heroRealizedToday">—</span>
        <span class="hero-stat-sub"></span>
      </div>
    </div>
  </section>

      </div>
      <div class="calendar-weekdays">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span class="calendar-week-head" data-l10n-id="home-calendar-week"></span>

      <div class="calendar-summary">
        <div class="calendar-summary-stat">
          <span class="calendar-summary-label" data-l10n-id="home-calendar-month-pnl"></span>
          <span class="calendar-summary-value" id="calendarMonthPnl">—</span>
        </div>
        <div class="calendar-summary-stat">
          <span class="calendar-summary-label" data-l10n-id="home-calendar-trades"></span>
          <span class="calendar-summary-value" id="calendarMonthTrades">—</span>
        </div>
        <div class="calendar-summary-stat">
          <span class="calendar-summary-label" data-l10n-id="home-calendar-win-days"></span>
          <span class="calendar-summary-value" id="calendarWinDays">—</span>
        </div>
        <div class="calendar-summary-stat">
          <span class="calendar-summary-label" data-l10n-id="home-calendar-loss-days"></span>
          <span class="calendar-summary-value" id="calendarLossDays">—</span>
        </div>
        <div class="calendar-summary-stat">
          <span class="calendar-summary-label" data-l10n-id="home-calendar-best-day"></span>
          <span class="calendar-summary-value" id="calendarBestDay">—</span>
        </div>
      </div>

    <aside class="home-status" data-l10n-id="home-status">
      <section
        class="operations-section status-section"
        id="homeTraderStatus"
        aria-labelledby="traderStatusHeading"
      >
        <div class="workspace-header">
          <h2 id="traderStatusHeading">
            <i class="icon-bot"></i> <span data-l10n-id="home-status-trader-title"></span>
          </h2>
          <span class="status-state" id="traderStatusState">—</span>
        </div>
        <div class="home-ledger" id="traderStatusLedger">
          <div class="home-ledger-row">
            <span class="position-label" data-l10n-id="home-status-open-positions"></span>
            <span class="position-value" id="traderOpenPositions">—</span>
          </div>
          <div class="home-ledger-row">
            <span class="position-label" data-l10n-id="home-status-entries-today"></span>
            <span class="position-value" id="traderEntriesToday">—</span>
          </div>
          <div class="home-ledger-row">
            <span class="position-label" data-l10n-id="home-status-exits-today"></span>
            <span class="position-value" id="traderExitsToday">—</span>
          </div>
        </div>
        <div class="status-setup" id="traderStatusSetup" hidden>
          <p class="status-note" data-l10n-id="home-status-trader-unavailable"></p>
          <button
            type="button"
            class="btn btn-sm btn-primary"
            data-status-setup
            data-l10n-id="home-status-setup"
          ></button>
        </div>
        <a
          class="status-link"
          href="/trader"
          data-page="trader"
          data-l10n-id="home-status-trader-open"
        ></a>
      </section>

      <section
        class="operations-section status-section"
        id="homeCopyStatus"
        aria-labelledby="copyStatusHeading"
      >
        <div class="workspace-header">
          <h2 id="copyStatusHeading">
            <i class="icon-copy"></i> <span data-l10n-id="home-status-copy-title"></span>
          </h2>
          <span class="status-state" id="copyStatusState">—</span>
        </div>
        <div class="home-ledger" id="copyStatusLedger">
          <div class="home-ledger-row">
            <span class="position-label" data-l10n-id="home-status-followed-wallets"></span>
            <span class="position-value" id="copyFollowedWallets">—</span>
          </div>
          <div class="home-ledger-row">
            <span class="position-label" data-l10n-id="home-status-active-tasks"></span>
            <span class="position-value" id="copyActiveTasks">—</span>
          </div>
          <div class="home-ledger-row">
            <span class="position-label" data-l10n-id="home-status-last-copy"></span>
            <span class="position-value" id="copyLastCopy">—</span>
          </div>
        </div>
        <div class="status-setup" id="copyStatusSetup" hidden>
          <p class="status-note" data-l10n-id="home-status-copy-unavailable"></p>
          <button
            type="button"
            class="btn btn-sm btn-primary"
            data-status-setup
            data-l10n-id="home-status-setup"
          ></button>
        </div>
        <a
          class="status-link"
          href="/copy"
          data-page="copy"
          data-l10n-id="home-status-copy-open"
        ></a>
      </section>
    </aside>

    <aside class="home-operations" data-l10n-id="home-operations">
      <section class="operations-section exposure-section" aria-labelledby="exposureHeading">
        <div class="workspace-header">
          <h2 id="exposureHeading">
            <i class="icon-trending-up"></i> <span data-l10n-id="home-exposure-title"></span>
          </h2>
          <span class="section-count"
            ><span id="positionsCount">—</span> <span data-l10n-id="home-exposure-open"></span
          ></span>
        </div>
        <p class="exposure-empty" id="exposureEmpty" data-l10n-id="home-exposure-empty" hidden></p>
        <div class="home-ledger" id="exposureLedger">
          <div class="home-ledger-row">
            <span class="position-label" data-l10n-id="home-exposure-invested"></span>
            <span class="position-value" id="positionsInvested">—</span>
          </div>
          <div class="home-ledger-row">
            <span class="position-label" data-l10n-id="home-exposure-value"></span>
            <span class="position-value" id="positionsValue">—</span>
          </div>
          <div class="home-ledger-row">
            <span class="position-label" data-l10n-id="home-stat-open-pnl"></span>
            <span class="position-value" id="positionsPnl">—</span>
          </div>
          <div class="home-ledger-row" data-scope="single" hidden>
            <span class="position-label" data-l10n-id="home-exposure-position"></span>
            <span class="position-value" id="positionsOnly">—</span>
          </div>
          <div class="home-ledger-row" data-scope="single" hidden>
            <span class="position-label" data-l10n-id="home-exposure-held"></span>
            <span class="position-value" id="positionsHeld">—</span>
          </div>
          <div class="home-ledger-row" data-scope="multi" hidden>
            <span class="position-label" data-l10n-id="home-exposure-avg-size"></span>
            <span class="position-value" id="positionsAvgSize">—</span>
          </div>
          <div class="home-ledger-row" data-scope="multi" hidden>
            <span class="position-label" data-l10n-id="home-exposure-avg-hold"></span>
            <span class="position-value" id="positionsAvgHold">—</span>
          </div>
          <div class="home-ledger-row" data-scope="multi" hidden>
            <span class="position-label" data-l10n-id="home-exposure-best"></span>
            <span class="position-value" id="positionsBest">—</span>
          </div>
          <div class="home-ledger-row" data-scope="multi" hidden>
            <span class="position-label" data-l10n-id="home-exposure-worst"></span>
            <span class="position-value" id="positionsWorst">—</span>
          </div>
        </div>
      </section>

      <section class="operations-section pipeline-section" aria-labelledby="pipelineHeading">
        <div class="workspace-header">
          <h2 id="pipelineHeading">
            <i class="icon-funnel"></i> <span data-l10n-id="home-pipeline-title"></span>
          </h2>
        </div>
        <ol class="pipeline-funnel">
          <li class="pipeline-metric pipeline-step">
            <span data-l10n-id="home-pipeline-tracked"></span><strong id="tokensTotal">—</strong>
          </li>
          <li class="pipeline-metric pipeline-step">
            <span data-l10n-id="home-pipeline-monitored"></span
            ><strong id="tokensMonitored">—</strong>
          </li>
          <li class="pipeline-metric pipeline-step">
            <span data-l10n-id="home-pipeline-passed"></span><strong id="tokensPassed">—</strong>
          </li>
        </ol>
        <div class="pipeline-grid">
          <div class="pipeline-metric">
            <span data-l10n-id="home-pipeline-rejected"></span
            ><strong id="tokensRejected">—</strong>
          </div>
          <div class="pipeline-metric">
            <span data-l10n-id="home-pipeline-blacklisted"></span
            ><strong id="tokensBlacklisted">—</strong>
          </div>
          <div class="pipeline-metric">
            <span data-l10n-id="home-pipeline-live-price"></span
            ><strong id="tokensWithPrices">—</strong>
          </div>
          <div class="pipeline-metric">
            <span data-l10n-id="home-pipeline-ohlcv"></span><strong id="tokensOhlcv">—</strong>
          </div>
        </div>
      </section>

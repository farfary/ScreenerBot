     Assistant page markup - the AI assistant chat panel and its tabs. -->
<div class="page-table assistant-page">
  <main class="assistant-main-panel">
    <div id="assistant-content">
      <!-- Chat Panel (populated by ChatWidget) -->
      <div id="chat-panel" class="assistant-panel-content active"></div>

      <!-- Stats Panel (Overview) -->
      <div id="stats-panel" class="assistant-panel-content">
        <div class="assistant-panel-header">
          <h2 class="assistant-panel-title" data-l10n-id="assistant-overview-title"></h2>
          <p class="assistant-panel-description" data-l10n-id="assistant-overview-description"></p>
        </div>

        <!-- Shared model-feature status control -->
        <div class="assistant-status-bar" id="assistant-status-bar">
          <div class="status-bar-main">
            <div class="status-bar-icon" id="assistant-status-icon">
              <i class="icon-bot"></i>
            </div>
            <div class="status-bar-info">
              <span class="status-bar-title" data-l10n-id="assistant-features-title"></span>
              <span
                class="status-bar-status"
                id="assistant-status-text"
                data-l10n-id="common-loading"
              ></span>
            </div>
          </div>
          <label class="toggle" data-level="root">
            <input type="checkbox" id="stats-assistant-toggle" disabled />
            <span class="toggle-track"></span>
            <span
              class="toggle-state"
              id="stats-toggle-label"
              data-l10n-id="assistant-toggle-off"
            ></span>
          </label>
        </div>

        <!-- Key Metrics -->
        <div class="metrics-grid">
          <div class="metric-card metric-card--with-icon">
            <div class="metric-icon"><i class="icon-hash"></i></div>
            <div class="metric-content">
              <div class="metric-label" data-l10n-id="assistant-metric-total-evaluations"></div>
              <div class="metric-value" id="metric-total-evaluations">0</div>
            </div>
          </div>
          <div class="metric-card metric-card--with-icon" data-accent="success">
            <div class="metric-icon"><i class="icon-zap"></i></div>
            <div class="metric-content">
              <div class="metric-label" data-l10n-id="assistant-metric-cache-hit-rate"></div>
              <div class="metric-value" id="metric-cache-hit-rate">0%</div>
            </div>
          </div>
          <div class="metric-card metric-card--with-icon" data-accent="info">
            <div class="metric-icon"><i class="icon-timer"></i></div>
            <div class="metric-content">
              <div class="metric-label" data-l10n-id="assistant-metric-avg-latency"></div>
              <div class="metric-value" id="metric-avg-latency">0ms</div>
            </div>
          </div>
          <div class="metric-card metric-card--with-icon" data-accent="warning">
            <div class="metric-icon"><i class="icon-server"></i></div>
            <div class="metric-content">
              <div class="metric-label" data-l10n-id="assistant-metric-active-providers"></div>
              <div class="metric-value" id="metric-providers">0 / 9</div>
            </div>
          </div>
        </div>

        <!-- Recent Decisions Section -->
        <div class="stats-section stats-section-decisions">
          <div class="section-header">
            <h3>
              <i class="icon-list"></i> <span data-l10n-id="assistant-decisions-title"></span>
            </h3>
            <span class="section-subtitle" data-l10n-id="assistant-decisions-subtitle"></span>
          </div>
          <div id="recent-decisions-container"></div>
        </div>
      </div>

      <!-- Providers Panel -->
      <div id="providers-panel" class="assistant-panel-content">
        <div class="assistant-panel-header">
          <h2 class="assistant-panel-title" data-l10n-id="assistant-providers-title"></h2>
          <p class="assistant-panel-description" data-l10n-id="assistant-providers-description"></p>
        </div>

        <div class="providers-list-container">
          <!-- NOTE: Provider logos are loaded dynamically. Alt text is set via JS for proper provider names. -->
          <div class="providers-list" id="providers-list">
            <!-- Dynamically rendered by JavaScript -->
          </div>
        </div>
      </div>

      <!-- Settings Panel -->
      <div id="settings-panel" class="assistant-panel-content">
        <!-- Master Settings Card -->
        <div class="settings-card">
          <div class="settings-card-header">
            <h3 class="settings-card-title" data-l10n-id="assistant-master-title"></h3>
            <p class="settings-card-description" data-l10n-id="assistant-master-description"></p>
          </div>
          <div class="settings-card-body">
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-enabled"
                  data-l10n-id="assistant-features-title"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-enabled-description"
                ></span>
              </div>
              <div class="setting-control">
                <label class="toggle">
                  <input type="checkbox" id="setting-enabled" />
                  <span class="toggle-track"></span>
                </label>
              </div>
            </div>
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-default-provider"
                  data-l10n-id="assistant-setting-default-provider-label"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-default-provider-description"
                ></span>
              </div>
              <div class="setting-control">
                <select id="setting-default-provider" data-custom-select>
                  <option value="" data-l10n-id="assistant-provider-select"></option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Filtering Card -->
        <div class="settings-card">
          <div class="settings-card-header">
            <h3 class="settings-card-title" data-l10n-id="assistant-filtering-title"></h3>
            <p class="settings-card-description" data-l10n-id="assistant-filtering-description"></p>
          </div>
          <div class="settings-card-body">
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-filtering-enabled"
                  data-l10n-id="assistant-setting-filtering-enabled-label"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-filtering-enabled-description"
                ></span>
              </div>
              <div class="setting-control">
                <label class="toggle">
                  <input type="checkbox" id="setting-filtering-enabled" />
                  <span class="toggle-track"></span>
                </label>
              </div>
            </div>
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-min-confidence"
                  data-l10n-id="assistant-setting-min-confidence-label"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-min-confidence-description"
                ></span>
              </div>
              <div class="setting-control">
                <div class="range-slider">
                  <input
                    type="range"
                    id="setting-min-confidence"
                    min="0"
                    max="100"
                    step="5"
                    value="70"
                  />
                  <span class="range-value" id="slider-value-min-confidence">70</span>
                </div>
              </div>
            </div>
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-fallback-pass"
                  data-l10n-id="assistant-setting-fallback-pass-label"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-fallback-pass-description"
                ></span>
              </div>
              <div class="setting-control">
                <label class="toggle">
                  <input type="checkbox" id="setting-fallback-pass" />
                  <span class="toggle-track"></span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- Trading Card -->
        <div class="settings-card">
          <div class="settings-card-header">
            <h3 class="settings-card-title" data-l10n-id="assistant-trading-title"></h3>
            <p class="settings-card-description" data-l10n-id="assistant-trading-description"></p>
          </div>
          <div class="settings-card-body">
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-entry-analysis"
                  data-l10n-id="assistant-setting-entry-analysis-label"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-entry-analysis-description"
                ></span>
              </div>
              <div class="setting-control">
                <label class="toggle">
                  <input type="checkbox" id="setting-entry-analysis" />
                  <span class="toggle-track"></span>
                </label>
              </div>
            </div>
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-exit-analysis"
                  data-l10n-id="assistant-setting-exit-analysis-label"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-exit-analysis-description"
                ></span>
              </div>
              <div class="setting-control">
                <label class="toggle">
                  <input type="checkbox" id="setting-exit-analysis" />
                  <span class="toggle-track"></span>
                </label>
              </div>
            </div>
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-trailing-stop"
                  data-l10n-id="assistant-setting-trailing-stop-label"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-trailing-stop-description"
                ></span>
              </div>
              <div class="setting-control">
                <label class="toggle">
                  <input type="checkbox" id="setting-trailing-stop" />
                  <span class="toggle-track"></span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- Auto Blacklist Card -->
        <div class="settings-card">
          <div class="settings-card-header">
            <h3 class="settings-card-title" data-l10n-id="assistant-blacklist-title"></h3>
            <p class="settings-card-description" data-l10n-id="assistant-blacklist-description"></p>
          </div>
          <div class="settings-card-body">
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-auto-blacklist-enabled"
                  data-l10n-id="assistant-setting-auto-blacklist-label"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-auto-blacklist-description"
                ></span>
              </div>
              <div class="setting-control">
                <label class="toggle">
                  <input type="checkbox" id="setting-auto-blacklist-enabled" />
                  <span class="toggle-track"></span>
                </label>
              </div>
            </div>
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-blacklist-min-confidence"
                  data-l10n-id="assistant-setting-blacklist-threshold-label"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-blacklist-threshold-description"
                ></span>
              </div>
              <div class="setting-control">
                <div class="range-slider">
                  <input
                    type="range"
                    id="setting-blacklist-min-confidence"
                    min="0"
                    max="100"
                    step="5"
                    value="30"
                  />
                  <span class="range-value" id="slider-value-blacklist-min-confidence">30</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Performance Card -->
        <div class="settings-card">
          <div class="settings-card-header">
            <h3 class="settings-card-title" data-l10n-id="assistant-performance-title"></h3>
            <p
              class="settings-card-description"
              data-l10n-id="assistant-performance-description"
            ></p>
          </div>
          <div class="settings-card-body">
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-cache-ttl"
                  data-l10n-id="assistant-setting-cache-ttl-label"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-cache-ttl-description"
                ></span>
              </div>
              <div class="setting-control">
                <div class="range-slider">
                  <input
                    type="range"
                    id="setting-cache-ttl"
                    min="60"
                    max="3600"
                    step="60"
                    value="300"
                  />
                  <span class="range-value" id="slider-value-cache-ttl">300</span>
                </div>
              </div>
            </div>
            <div class="setting-item">
              <div class="setting-info">
                <label
                  class="setting-label"
                  for="setting-max-evaluations"
                  data-l10n-id="assistant-setting-max-evaluations-label"
                ></label>
                <span
                  class="setting-description"
                  data-l10n-id="assistant-setting-max-evaluations-description"
                ></span>
              </div>
              <div class="setting-control">
                <div class="range-slider">
                  <input
                    type="range"
                    id="setting-max-evaluations"
                    min="1"
                    max="20"
                    step="1"
                    value="5"
                  />
                  <span class="range-value" id="slider-value-max-evaluations">5</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Cache Management Card -->
        <div class="settings-card">
          <div class="settings-card-header">
            <h3 class="settings-card-title" data-l10n-id="assistant-cache-title"></h3>
            <p class="settings-card-description" data-l10n-id="assistant-cache-description"></p>
          </div>
          <div class="settings-card-body">
            <div class="cache-stats">
              <div class="cache-stat">
                <span class="cache-stat-label" data-l10n-id="assistant-cache-size-label"></span>
                <span class="cache-stat-value" id="cache-size">0</span>
              </div>
              <div class="cache-stat">
                <span class="cache-stat-label" data-l10n-id="assistant-cache-memory-label"></span>
                <span class="cache-stat-value" id="cache-memory">—</span>
              </div>
            </div>
            <button type="button" class="btn btn-secondary" id="clear-cache-btn">
              <i class="icon-trash-2"></i> <span data-l10n-id="assistant-cache-clear"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Testing Panel -->
      <div id="testing-panel" class="assistant-panel-content">
        <div class="testing-section">
          <div class="section-header">
            <h3>
              <i class="icon-flask-conical"></i>
              <span data-l10n-id="assistant-testing-title"></span>
            </h3>
            <span class="section-subtitle" data-l10n-id="assistant-testing-subtitle"></span>
          </div>

          <div class="testing-form">
            <div class="form-group">
              <label for="test-mint-address" data-l10n-id="assistant-testing-mint-label"></label>
              <input dir="ltr"
                type="text"
                id="test-mint-address"
                class="form-control"
                data-l10n-id="assistant-testing-mint-input"
              />
            </div>

            <div class="form-group">
              <label for="test-priority" data-l10n-id="assistant-testing-priority-label"></label>
              <select id="test-priority" class="form-control" data-custom-select>
                <option value="low" data-l10n-id="assistant-testing-priority-low"></option>
                <option
                  value="medium"
                  selected
                  data-l10n-id="assistant-testing-priority-medium"
                ></option>
                <option value="high" data-l10n-id="assistant-testing-priority-high"></option>
              </select>
            </div>

            <button type="button" class="btn btn-primary" id="evaluate-btn">
              <i class="icon-play"></i> <span data-l10n-id="assistant-testing-evaluate"></span>
            </button>
          </div>

          <div id="testing-results" class="testing-results" style="display: none">
            <div class="section-header">
              <h4>
                <i class="icon-file-text"></i>
                <span data-l10n-id="assistant-testing-results"></span>
              </h4>
            </div>
            <div id="testing-results-content"></div>
          </div>
        </div>
      </div>

      <!-- Instructions Panel -->
      <div id="instructions-panel" class="assistant-panel-content">
        <div class="assistant-panel-header">
          <div class="panel-header-content">
            <h2 class="assistant-panel-title" data-l10n-id="assistant-instructions-title"></h2>
            <p
              class="assistant-panel-description"
              data-l10n-id="assistant-instructions-description"
            ></p>
          </div>
          <button type="button" class="btn btn-primary" id="new-instruction-btn">
            <i class="icon-plus"></i> <span data-l10n-id="assistant-instructions-new"></span>
          </button>
        </div>

        <!-- Filters and Search -->
        <div class="instructions-toolbar">
          <div class="filter-group">
            <select id="instructions-category-filter" class="filter-select" data-custom-select>
              <option value="all" data-l10n-id="assistant-instructions-category-all"></option>
              <option
                value="filtering"
                data-l10n-id="assistant-instructions-category-filtering"
              ></option>
              <option
                value="trading"
                data-l10n-id="assistant-instructions-category-trading"
              ></option>
              <option
                value="analysis"
                data-l10n-id="assistant-instructions-category-analysis"
              ></option>
              <option
                value="general"
                data-l10n-id="assistant-instructions-category-general"
              ></option>
            </select>
            <select id="instructions-status-filter" class="filter-select" data-custom-select>
              <option value="all" data-l10n-id="assistant-instructions-status-all"></option>
              <option value="active" data-l10n-id="assistant-instructions-status-active"></option>
              <option
                value="inactive"
                data-l10n-id="assistant-instructions-status-inactive"
              ></option>
            </select>
          </div>
          <div class="search-box">
            <input
              type="text"
              id="instructions-search"
              data-l10n-id="assistant-instructions-search"
              class="search-input"
            />
            <i class="search-icon icon-search"></i>
          </div>
        </div>

        <!-- Instructions List -->
        <div class="instructions-list-container">
          <div class="instructions-list" id="instructions-list">
            <!-- Rendered by JavaScript -->
            <div class="state-view state-view-empty state-view-compact" role="status" aria-live="polite">
              <div class="state-view-heading">
                <i class="state-view-icon icon-file-text" aria-hidden="true"></i>
                <span class="state-view-message" data-l10n-id="assistant-instructions-empty"></span>
              </div>
              <button
                type="button"
                class="btn btn-sm btn-secondary state-view-action"
                data-action="create-instruction"
                data-l10n-id="assistant-instructions-empty-add"
              ></button>
            </div>
          </div>
        </div>

        <!-- Templates Section (Collapsible) -->
        <div class="templates-section">
          <div class="templates-header" id="templates-toggle-btn">
            <div class="templates-title">
              <i class="templates-icon icon-library"></i>
              <span data-l10n-id="assistant-templates-title"></span>
            </div>
            <span class="templates-toggle" id="templates-toggle">▼</span>
          </div>
          <div class="templates-body" id="templates-body">
            <p class="templates-description" data-l10n-id="assistant-templates-description"></p>
            <div class="templates-grid" id="templates-list">
              <!-- Rendered by JavaScript -->
            </div>
          </div>
        </div>
      </div>

      <!-- Automation Panel -->
      <div id="automation-panel" class="assistant-panel-content">
        <div class="assistant-panel-header">
          <div class="panel-header-content">
            <h2 class="assistant-panel-title" data-l10n-id="assistant-automation-title"></h2>
            <p
              class="assistant-panel-description"
              data-l10n-id="assistant-automation-description"
            ></p>
          </div>
          <button
            type="button"
            class="btn btn-primary"
            id="new-automation-btn"
            data-l10n-id="assistant-automation-new"
          >
            <i class="icon-plus"></i> <span data-l10n-id="assistant-automation-new-label"></span>
          </button>
        </div>

        <!-- Automation Stats Summary -->
        <div class="automation-stats" id="automation-stats">
          <div class="automation-stat-card">
            <div class="stat-value" id="auto-stat-total">0</div>
            <div class="stat-label" data-l10n-id="assistant-automation-stat-total"></div>
          </div>
          <div class="automation-stat-card">
            <div class="stat-value" id="auto-stat-active">0</div>
            <div class="stat-label" data-l10n-id="assistant-automation-stat-active"></div>
          </div>
          <div class="automation-stat-card">
            <div class="stat-value" id="auto-stat-runs">0</div>
            <div class="stat-label" data-l10n-id="assistant-automation-stat-runs"></div>
          </div>
          <div class="automation-stat-card">
            <div class="stat-value" id="auto-stat-success-rate">—</div>
            <div class="stat-label" data-l10n-id="assistant-automation-stat-success-rate"></div>
          </div>
        </div>

        <!-- Task List -->
        <div class="automation-list-container">
          <div class="automation-list" id="automation-list">
            <div class="state-view state-view-empty state-view-compact" role="status" aria-live="polite">
              <div class="state-view-heading">
                <i class="state-view-icon icon-zap" aria-hidden="true"></i>
                <span class="state-view-title" data-l10n-id="assistant-automation-empty"></span>
              </div>
              <div class="state-view-message" data-l10n-id="assistant-automation-empty-subtitle"></div>
              <button
                type="button"
                class="btn btn-sm btn-secondary state-view-action"
                data-action="create-automation-task"
                data-l10n-id="assistant-automation-empty-add"
              ></button>
            </div>
          </div>
        </div>

        <!-- Recent Runs Timeline -->
        <div class="automation-runs-section">
          <div class="automation-runs-header">
            <h3 class="automation-runs-title">
              <i class="icon-clock"></i>
              <span data-l10n-id="assistant-automation-runs-title"></span>
            </h3>
            <span class="automation-runs-count" id="auto-runs-count"></span>
          </div>
          <div class="automation-runs-list" id="automation-runs-list">
            <!-- Rendered by JavaScript -->
          </div>
        </div>
      </div>

      <!-- History Panel -->
      <div id="history-panel" class="assistant-panel-content">
        <div class="history-section">
          <div class="section-header">
            <h3><i class="icon-clock"></i> <span data-l10n-id="assistant-history-title"></span></h3>
            <span class="section-subtitle" data-l10n-id="assistant-history-subtitle"></span>
          </div>
          <div id="history-list" class="history-list"></div>
        </div>
      </div>
    </div>
  </main>
</div>

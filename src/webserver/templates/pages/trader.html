          <label class="stats-control">

            <span class="stats-control-text">
              <span class="stats-control-label" data-l10n-id="trader-monitor-exit"></span>
              <span

                id="exit-monitor-status"
                data-l10n-id="trader-monitor-dormant"
                hidden

            </span>
          </label>

    <!-- Stop Loss Tab -->
    <div id="stop-loss-tab" class="trader-tab-content" style="display: none">
      <div class="config-section">
        <div class="config-card">
          <div class="card-header">
            <div class="card-header-text">
              <h3>
                <i class="icon-shield-off"></i> <span data-l10n-id="trader-stop-loss-title"></span>

              <p class="card-subtitle" data-l10n-id="trader-stop-loss-subtitle"></p>
            </div>
            <label class="toggle">
              <input type="checkbox" id="stop-loss-enabled" />
              <span class="toggle-track"></span>
            </label>
          </div>

          <!-- Stop Loss Threshold -->
          <div class="config-group">
            <div class="config-label-row">
              <label for="stop-loss-threshold" class="config-label">
                <i class="icon-trending-down"></i>
                <span data-l10n-id="config-trader-stop-loss-threshold-pct"></span>
              </label>
            </div>
            <p class="config-hint"></p>
            <div class="input-group-enhanced">
              <span class="input-prefix" aria-hidden="true">−</span>
              <input type="number" id="stop-loss-threshold" class="input-large" />
              <span class="input-unit">%</span>
            </div>
            <div class="config-impact">
              <span class="impact-text" id="stop-loss-impact"></span>
            </div>
          </div>

          <!-- Sell Part First -->
          <div class="config-group">
            <div class="config-label-row">
              <label for="stop-loss-allow-partial" class="config-label">
                <i class="icon-scissors"></i>
                <span data-l10n-id="config-trader-stop-loss-allow-partial"></span>
              </label>
            </div>
            <p class="config-hint"></p>
            <div class="input-group-enhanced">
              <span class="toggle-field" id="stop-loss-allow-partial-frame">
                <label class="toggle">
                  <input type="checkbox" id="stop-loss-allow-partial" />
                  <span class="toggle-track"></span>
                </label>
              </span>
            </div>

            <!-- Part to Sell: shown under its switch while Sell Part First is on; bounds and unit come from the field metadata -->
            <div
              class="config-group config-group-dependent"
              id="stop-loss-partial-pct-group"
              hidden
            >
              <div class="config-label-row">
                <label for="stop-loss-partial-pct" class="config-label">
                  <i class="icon-chart-pie"></i>
                  <span data-l10n-id="config-trader-stop-loss-partial-pct"></span>
                </label>
              </div>
              <p class="config-hint"></p>
              <div class="input-group-enhanced">
                <input type="number" id="stop-loss-partial-pct" class="input-large" />
                <span class="input-unit"></span>
              </div>
            </div>
          </div>

          <!-- Minimum Hold Time -->
          <div class="config-group">
            <div class="config-label-row">
              <label for="stop-loss-min-hold" class="config-label">
                <i class="icon-clock"></i>
                <span data-l10n-id="config-trader-stop-loss-min-hold-seconds"></span>
              </label>
            </div>
            <p class="config-hint"></p>
            <div class="input-group-enhanced">
              <input
                type="number"
                id="stop-loss-min-hold"
                min="0"
                max="86400"
                step="1"
                value="0"
                class="input-large"
              />
              <span class="input-unit"></span>
            </div>
            <div class="config-impact">
              <span
                class="impact-text"
                id="stop-loss-hold-time-display"
                data-l10n-id="trader-stop-loss-hold-immediate"
              ></span>
            </div>
          </div>

          <!-- Visual Example -->
          <div class="visual-example">
            <h4>
              <i class="icon-chart-bar"></i>
              <span data-l10n-id="trader-example-how-it-works"></span>
            </h4>
            <div class="example-timeline">
              <div class="timeline-step">
                <div class="step-icon step-icon-entry">
                  <i class="icon-arrow-right"></i>
                </div>
                <div class="step-content">
                  <div class="step-title" data-l10n-id="trader-step-entry"></div>
                  <div class="step-value" id="stop-loss-example-entry">—</div>
                  <div class="step-detail" data-l10n-id="trader-step-initial-position"></div>
                </div>
              </div>
              <div class="timeline-arrow"><i class="icon-chevron-right"></i></div>
              <div class="timeline-step">
                <div class="step-icon step-icon-activation">
                  <i class="icon-trending-down"></i>
                </div>
                <div class="step-content">
                  <div class="step-title" data-l10n-id="trader-stop-loss-price-falls"></div>
                  <div class="step-value" id="stop-loss-example-trigger">-50%</div>
                  <div class="step-detail" data-l10n-id="trader-stop-loss-threshold-reached"></div>
                </div>
              </div>
              <div class="timeline-arrow"><i class="icon-chevron-right"></i></div>
              <div class="timeline-step">
                <div class="step-icon step-icon-exit">
                  <i class="icon-log-out"></i>
                </div>
                <div class="step-content">
                  <div
                    class="step-title"
                    id="stop-loss-exit-title"
                    data-l10n-id="trader-step-auto-exit"
                  ></div>
                  <div class="step-value" id="stop-loss-example-exit">—</div>
                  <div
                    class="step-detail"
                    id="stop-loss-exit-detail"
                    data-l10n-id="trader-step-full-exit"
                  ></div>
                </div>
              </div>
              <div class="timeline-arrow" id="stop-loss-rest-arrow" hidden>
                <i class="icon-chevron-right"></i>
              </div>
              <div class="timeline-step" id="stop-loss-rest-step" hidden>
                <div class="step-icon step-icon-exit">
                  <i class="icon-log-out"></i>
                </div>
                <div class="step-content">
                  <div class="step-title" data-l10n-id="trader-stop-loss-sell-rest"></div>
                  <div class="step-value" id="stop-loss-example-rest">—</div>
                  <div class="step-detail" data-l10n-id="trader-stop-loss-still-below"></div>
                </div>
              </div>
            </div>
            <div class="example-summary">
              <div class="summary-item summary-item-warning">
                <i class="icon-shield-off"></i>
                <span id="stop-loss-example-loss"></span>
              </div>
              <div class="summary-item summary-item-info">
                <i class="icon-info"></i>
                <span data-l10n-id="trader-stop-loss-note" data-l10n-markup></span>
              </div>
            </div>
          </div>
        </div>
      </div>

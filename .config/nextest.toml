# Nextest configuration for ScreenerBot.
#
# nextest gives PER-TEST PROCESS ISOLATION. This is not a nicety: the app uses many
# global singletons (OnceLock config, ArcSwap live snapshots, the service-manager
# global Option, r2d2 DB pools). Under plain `cargo test` every test shares one
# process and that state collides; nextest runs each test in its own process, so every
# test starts from a clean global world and a `panic = "abort"` is just that test
# failing, not the whole binary.
#
# Integration tests are organised by DOMAIN (tests/apis.rs, rpc.rs, ohlcv.rs, ...) and
# the levels are the standard `#[ignore]` attribute — see tests/common/mod.rs. Run:
#   pure     cargo nextest run
#   live     cargo nextest run --run-ignored ignored-only -E 'kind(test)'
#   mainnet  SB_TEST_MAINNET_SWAP=1 SB_TEST_WALLET=... (same live command)
# `kind(test)` scopes the ignored run to integration tests, never the lib's own
# ignored unit tests. ../test.sh wraps these exact commands (logging + confirmation).

[profile.default]
# Non-live suite. fail-fast off so one failure never hides the rest of the report.
fail-fast = false
retries = 0
failure-output = "immediate-final"
status-level = "pass"
final-status-level = "fail"

[profile.default.junit]
path = "junit.xml"

# Live suite (test.sh live / mainnet). Real network is flaky, so retry transient
# failures and cap any single call that hangs.
[profile.live]
fail-fast = false
retries = { backoff = "exponential", count = 2, delay = "2s", max-delay = "10s" }
slow-timeout = { period = "30s", terminate-after = 3 }
failure-output = "immediate-final"
status-level = "pass"

[profile.live.junit]
path = "junit.xml"

# Test groups bound concurrency for tests that must not run wide-open in parallel.
[test-groups]
# Real mainnet swap tests must never run in parallel (money / one wallet nonce).
# Convention: name a money test `mainnet_*` and it lands in this group automatically.
serial-mainnet = { max-threads = 1 }
# Real-database tests each clone the owner's databases (hundreds of MB) and then walk
# tens of thousands of tokens. Running them concurrently would multiply both costs.
# Convention: name such a test `realdata_*` and it lands in this group automatically.
serial-realdata = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/mainnet/)'
test-group = 'serial-mainnet'

[[profile.live.overrides]]
filter = 'test(/mainnet/)'
test-group = 'serial-mainnet'

# The live profile's 30s slow-timeout suits a network call, not a full-corpus filtering
# pass in a debug build. Give the real-database tier room, and let it be killed only if
# it has genuinely hung.
[[profile.live.overrides]]
filter = 'test(/realdata/)'
test-group = 'serial-realdata'
slow-timeout = { period = "60s", terminate-after = 15 }
retries = 0

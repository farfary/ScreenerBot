# Nextest configuration for ScreenerBot.
#
# One command runs the whole suite with PER-TEST PROCESS ISOLATION. This is not a
# nicety: the app uses many global singletons (OnceLock config, ArcSwap live
# snapshots, the service-manager global Option, r2d2 DB pools). Under plain
# `cargo test` every test shares one process and that state collides; nextest runs
# each test in its own process, so every test starts from a clean global world and
# a `panic = "abort"` in one test is just that test failing, not the whole binary.
#
# Tiers (defined in tests/common/mod.rs):
#   L0  default tests                    — pure/deterministic, no network/DB/wallet
#   L1  #[ignore] + read-only network    — APIs, RPC, screenerbot-data server
#   L2  #[ignore] + real mainnet swap    — spends SOL, never runs by default
#
# Drive it with ../test.sh (from the wrapper root): `./test.sh`, `./test.sh live`,
# `./test.sh mainnet`, or `./test.sh <name-filter>`.

[profile.default]
# Non-live suite. fail-fast off so one failure never hides the rest of the report.
fail-fast = false
retries = 0
failure-output = "immediate-final"
status-level = "pass"
final-status-level = "fail"

[profile.default.junit]
path = "junit.xml"

# Live suite (test.sh live / mainnet). Real network is flaky, so retry transient
# failures and cap any single call that hangs.
[profile.live]
fail-fast = false
retries = { backoff = "exponential", count = 2, delay = "2s", max-delay = "10s" }
slow-timeout = { period = "30s", terminate-after = 3 }
failure-output = "immediate-final"
status-level = "pass"

[profile.live.junit]
path = "junit.xml"

# Test groups bound concurrency for tests that must not run wide-open in parallel.
[test-groups]
# Anything touching shared DB/global state or spending money runs one-at-a-time.
serial-state = { max-threads = 1 }
# Live network tests share upstream rate limits — keep the fan-out modest.
live-network = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(/^l2_/)'
test-group = 'serial-state'

[[profile.live.overrides]]
filter = 'binary(/^l1_/)'
test-group = 'live-network'

[[profile.live.overrides]]
filter = 'binary(/^l2_/)'
test-group = 'serial-state'

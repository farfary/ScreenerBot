<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
  <title>ScreenerBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* Variables matching dashboard */
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #1c2128;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --border-color: #30363d;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.4);
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'JetBrains Mono', 'SF Mono', 'Monaco', 'Menlo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1c2128 100%);
      color: var(--text-primary);
      -webkit-user-select: none;
      user-select: none;
      -webkit-app-region: drag;
    }
    
    .splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      animation: splashFadeIn 0.6s ease-out;
    }
    
    @keyframes splashFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    /* Logo with glow effect - 120x120 container */
    .splash-logo-container {
      position: relative;
      width: 120px;
      height: 120px;
    }
    
    .splash-logo {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px rgba(88, 166, 255, 0.4));
      animation: splashPulse 2s ease-in-out infinite;
    }
    
    @keyframes splashPulse {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(88, 166, 255, 0.4)); }
      50% { filter: drop-shadow(0 0 40px rgba(88, 166, 255, 0.6)); }
    }
    
    /* Brand text */
    .splash-brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #e6edf3;
      text-shadow: 0 0 20px rgba(88, 166, 255, 0.5), 0 0 40px rgba(88, 166, 255, 0.3);
    }
    
    /* Loading indicator */
    .splash-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
    }
    
    .splash-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: splashSpin 0.8s linear infinite;
    }
    
    @keyframes splashSpin {
      to { transform: rotate(360deg); }
    }
    
    .splash-status {
      font-size: 0.875rem;
      color: #8b949e;
      font-weight: 500;
      letter-spacing: 0.05em;
      transition: opacity 0.3s ease;
    }
    
    /* Version badge */
    .splash-version {
      position: fixed;
      bottom: 2rem;
      font-size: 0.75rem;
      color: #6e7681;
      font-family: 'JetBrains Mono', 'SF Mono', 'Monaco', 'Menlo', monospace;
    }

    /* ====================================================================
       Boot-error screen — shown only when the backend cannot start.
       Hidden by default so a healthy boot is completely silent.
       ==================================================================== */
    .boot-error {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 2.5rem 1.5rem;
      -webkit-app-region: no-drag;
    }

    .boot-error.visible { display: flex; }
    .splash-screen.hidden { display: none; }

    .boot-error-card {
      width: 100%;
      max-width: 620px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      animation: splashFadeIn 0.4s ease-out;
    }

    .boot-error-head {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .boot-error-icon {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(248, 81, 73, 0.12);
      color: #f85149;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .boot-error-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .boot-error-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .boot-error-body { padding: 1.25rem 1.5rem; }

    .boot-error-detail {
      font-size: 0.85rem;
      line-height: 1.55;
      color: var(--text-secondary);
      white-space: pre-wrap;
      text-align: left;
      word-break: break-word;
      max-height: 220px;
      overflow-y: auto;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.875rem 1rem;
    }

    .boot-error-remedy {
      margin-top: 1rem;
      font-size: 0.85rem;
      line-height: 1.55;
      color: var(--text-primary);
      word-break: break-word;
      text-align: left;
    }

    #bootErrorRemedy {
      display: block;
      white-space: pre-wrap;
      text-align: left;
    }

    .boot-error-remedy-label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .boot-error-logpath {
      margin-top: 1rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', 'SF Mono', 'Monaco', 'Menlo', monospace;
      word-break: break-all;
    }

    .boot-error-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.625rem;
      padding: 1rem 1.5rem 1.25rem;
      border-top: 1px solid var(--border-color);
    }

    .boot-btn {
      -webkit-app-region: no-drag;
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .boot-btn.primary { background: #2ea043; color: #fff; }
    .boot-btn.primary:hover { background: #3fb950; }

    .boot-btn.secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-color);
    }
    .boot-btn.secondary:hover { border-color: #484f58; }

    .boot-btn.ghost { background: transparent; color: var(--text-secondary); }
    .boot-btn.ghost:hover { color: var(--text-primary); }

    .boot-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="splash-screen">
    <div class="splash-content">
      <div class="splash-logo-container">
        <!-- ScreenerBot Logo SVG - hexagon pattern only, no background box -->
        <svg class="splash-logo" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
          <g fill="white" transform="translate(400 400) scale(2.02) translate(-400 -400)">
            <polygon points="456,280 428,328.5 372,328.5 344,280 372,231.5 428,231.5"/>
            <polygon points="559.923,340 531.923,388.5 475.923,388.5 447.923,340 475.923,291.5 531.923,291.5"/>
            <polygon points="559.923,460 531.923,508.5 475.923,508.5 447.923,460 475.923,411.5 531.923,411.5"/>
            <polygon points="456,520 428,568.5 372,568.5 344,520 372,471.5 428,471.5"/>
            <polygon points="352.077,460 324.077,508.5 268.077,508.5 240.077,460 268.077,411.5 324.077,411.5"/>
            <polygon points="352.077,340 324.077,388.5 268.077,388.5 240.077,340 268.077,291.5 324.077,291.5"/>
          </g>
        </svg>
      </div>
      
      <div class="splash-brand">ScreenerBot</div>
      
      <div class="splash-loader">
        <div class="splash-spinner"></div>
        <div class="splash-status" id="status">Initializing...</div>
      </div>
    </div>
    
    <div class="splash-version" id="version"></div>
  </div>

  <!-- Boot-error screen — hidden unless the backend fails to start -->
  <div class="boot-error" id="bootError">
    <div class="boot-error-card">
      <div class="boot-error-head">
        <div class="boot-error-icon">!</div>
        <div>
          <div class="boot-error-title" id="bootErrorTitle">ScreenerBot could not start</div>
          <div class="boot-error-subtitle" id="bootErrorSubtitle"></div>
        </div>
      </div>
      <div class="boot-error-body">
        <div class="boot-error-detail" id="bootErrorDetail"></div>
        <div class="boot-error-remedy" id="bootErrorRemedyWrap" hidden>
          <span class="boot-error-remedy-label">How to fix</span>
          <span id="bootErrorRemedy"></span>
        </div>
        <div class="boot-error-logpath" id="bootErrorLogPath"></div>
      </div>
      <div class="boot-error-actions" id="bootErrorActions"></div>
    </div>
  </div>

  <script src="boot.js"></script>
</body>
</html>
